<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="轮胎仓库">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="大货车轮胎库存、记账与欠款管理">
  <title>轮胎仓库</title>
  <style>
:root {
  color-scheme: light;
  --bg: #f2f2f7;
  --surface: rgba(255, 255, 255, 0.92);
  --surface-solid: #ffffff;
  --text: #111114;
  --text-secondary: #707078;
  --text-tertiary: #9a9aa1;
  --line: rgba(17, 17, 20, 0.08);
  --accent: #ff8a00;
  --accent-soft: #fff0dd;
  --accent-strong: #c66200;
  --green: #248a3d;
  --green-soft: #e8f7eb;
  --red: #d70015;
  --red-soft: #ffe9eb;
  --blue: #007aff;
  --blue-soft: #e8f2ff;
  --orange: #f97316;
  --orange-soft: #ffedd5;
  --dark: #171719;
  --shadow: 0 12px 34px rgba(0, 0, 0, 0.08);
  --radius-xl: 24px;
  --radius-lg: 18px;
  --radius-md: 14px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; }

html { background: var(--bg); }

body {
  margin: 0;
  min-width: 0;
  min-height: 100vh;
  overflow-x: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

button, input, select, textarea { font: inherit; }
button { color: inherit; }
button:disabled { opacity: .42; cursor: not-allowed; }
button, a { -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 3px solid rgba(0, 122, 255, 0.25);
  outline-offset: 2px;
}

svg {
  width: 22px;
  height: 22px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.app-shell {
  width: 100%;
  min-height: 100svh;
  margin: 0 auto;
  padding-bottom: calc(92px + var(--safe-bottom));
  background:
    radial-gradient(circle at 85% 0%, rgba(255, 138, 0, 0.10), transparent 32%),
    var(--bg);
}

.app-header {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: calc(68px + var(--safe-top));
  padding: calc(12px + var(--safe-top)) 18px 12px;
  background: rgba(242, 242, 247, 0.82);
  border-bottom: 1px solid var(--line);
  backdrop-filter: saturate(180%) blur(22px);
  -webkit-backdrop-filter: saturate(180%) blur(22px);
}

.brand-block { display: flex; align-items: center; gap: 11px; }
.brand-block strong, .brand-block small { display: block; }
.brand-block strong { font-size: 17px; font-weight: 650; letter-spacing: -0.02em; }
.brand-block small { margin-top: 2px; color: var(--text-secondary); font-size: 11px; }
.brand-icon {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: var(--dark);
  color: var(--accent);
}
.brand-icon svg { width: 26px; height: 26px; }

.sync-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 32px;
  padding: 0 11px;
  border: 0;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.82);
  box-shadow: inset 0 0 0 1px var(--line);
  color: var(--text-secondary);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
}
.sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
.sync-pill.needs-sync .sync-dot { background: var(--accent); }
.sync-pill.sync-error .sync-dot { background: var(--red); }

.app-main { padding: 22px 16px 28px; }

.page-heading { display: flex; align-items: end; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
.page-heading h1 { margin: 0; font-size: 30px; font-weight: 720; letter-spacing: -0.045em; }
.page-heading p { margin: 6px 0 0; color: var(--text-secondary); font-size: 13px; }
.page-heading .date { color: var(--text-tertiary); font-size: 12px; white-space: nowrap; }

.hero-card {
  position: relative;
  overflow: hidden;
  padding: 22px;
  border-radius: var(--radius-xl);
  background: var(--dark);
  color: #fff;
  box-shadow: 0 18px 38px rgba(0, 0, 0, 0.14);
}
.hero-card::after {
  content: "";
  position: absolute;
  right: -48px;
  top: -62px;
  width: 190px;
  height: 190px;
  border: 28px solid rgba(255, 138, 0, 0.18);
  border-radius: 50%;
}
.hero-label { position: relative; z-index: 1; color: rgba(255,255,255,.64); font-size: 12px; }
.hero-value { position: relative; z-index: 1; margin-top: 7px; font-size: 42px; font-weight: 720; letter-spacing: -0.05em; }
.hero-value small { margin-left: 4px; font-size: 14px; font-weight: 500; color: rgba(255,255,255,.64); }
.hero-meta { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 9px 18px; margin-top: 18px; }
.hero-meta span { color: rgba(255,255,255,.68); font-size: 11px; }
.hero-meta b { display: block; margin-top: 3px; color: #fff; font-size: 15px; font-weight: 620; }

.stat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px; margin-top: 12px; }
.stat-grid.stat-grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.stat-card {
  min-width: 0;
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--surface);
}
.stat-card .label { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--text-secondary); font-size: 11px; }
.stat-card .value { margin-top: 10px; font-size: 22px; font-weight: 700; letter-spacing: -0.035em; }
.stat-card .value small { font-size: 12px; color: var(--text-tertiary); font-weight: 500; }
.mini-icon { display: grid; place-items: center; width: 29px; height: 29px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); }
.mini-icon svg { width: 16px; height: 16px; }
.mini-icon.red { background: var(--red-soft); color: var(--red); }
.mini-icon.green { background: var(--green-soft); color: var(--green); }
.mini-icon.blue { background: var(--blue-soft); color: var(--blue); }

.stat-card.warning { background: var(--orange-soft); border-color: rgba(249,115,22,.22); }
.stat-card.warning .value { color: var(--accent-strong); }
.stat-card.warning .mini-icon { background: rgba(249,115,22,.18); color: var(--orange); }
.stat-card.danger { background: var(--red-soft); border-color: rgba(215,0,21,.20); }
.stat-card.danger .value { color: var(--red); }
.stat-card.success { background: var(--green-soft); border-color: rgba(36,138,61,.20); }
.stat-card.success .value { color: var(--green); }
.stat-card.success .mini-icon { background: rgba(36,138,61,.16); color: var(--green); }

.section { margin-top: 25px; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 11px; }
.section-head h2 { margin: 0; font-size: 17px; font-weight: 680; letter-spacing: -0.02em; }
.section-head p { margin: 3px 0 0; color: var(--text-secondary); font-size: 11px; }
.text-button { border: 0; padding: 7px 0; background: transparent; color: var(--blue); font-size: 13px; font-weight: 600; cursor: pointer; }

.quick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.quick-grid.quick-grid-4 { grid-template-columns: repeat(4, 1fr); }
.quick-action {
  display: grid;
  justify-items: center;
  gap: 7px;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--text-secondary);
  font-size: 11px;
  cursor: pointer;
}
.quick-action .quick-icon {
  display: grid;
  place-items: center;
  width: 50px;
  height: 50px;
  border-radius: 16px;
  background: var(--surface-solid);
  box-shadow: 0 6px 18px rgba(0,0,0,.06), inset 0 0 0 1px var(--line);
  color: var(--text);
}
.quick-action.primary .quick-icon { background: var(--accent); color: #fff; box-shadow: 0 8px 18px rgba(255,138,0,.25); }
.quick-action svg { width: 21px; height: 21px; }

.alert-banner {
  display: grid;
  grid-template-columns: 42px 1fr auto;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: var(--radius-lg);
  background: var(--red-soft);
  text-align: left;
  cursor: pointer;
}
.alert-banner .alert-icon { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 13px; background: rgba(215,0,21,.09); color: var(--red); }
.alert-banner strong { display: block; font-size: 13px; }
.alert-banner small { display: block; margin-top: 3px; color: #8e4a50; font-size: 11px; }
.alert-banner .chevron { color: rgba(215,0,21,.45); }

.list-card {
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--surface);
}
.transaction-row {
  display: grid;
  grid-template-columns: 42px minmax(0,1fr) auto;
  align-items: center;
  gap: 12px;
  padding: 14px;
  border-top: 1px solid var(--line);
}
.transaction-row:first-child { border-top: 0; }
.transaction-icon { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 13px; background: var(--green-soft); color: var(--green); }
.transaction-icon.out { background: var(--blue-soft); color: var(--blue); }
.transaction-icon.income { background: var(--green-soft); color: var(--green); }
.transaction-icon.expense { background: var(--red-soft); color: var(--red); }
.transaction-icon svg { width: 19px; height: 19px; }
.transaction-main { min-width: 0; }
.transaction-main strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.transaction-main small { display: block; margin-top: 4px; color: var(--text-secondary); font-size: 11px; }
.transaction-main small .pay-status-badge { margin-left: 4px; }
.transaction-count { text-align: right; font-size: 14px; font-weight: 680; }
.transaction-count.in { color: var(--green); }
.transaction-count.out { color: var(--blue); }
.transaction-count small { display: block; margin-top: 3px; color: var(--text-tertiary); font-size: 10px; font-weight: 500; }

/* 滑动操作容器 */
.swipe-container {
  position: relative;
  overflow: hidden;
  border-top: 1px solid var(--line);
}
.swipe-container:first-child { border-top: 0; }
.swipe-actions {
  position: absolute;
  right: 0;
  top: 0;
  bottom: 0;
  display: flex;
  opacity: 0;
  transition: opacity 0.15s ease;
}
.swipe-container.is-open .swipe-actions {
  opacity: 1;
}
.swipe-action {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 72px;
  border: 0;
  font-size: 13px;
  font-weight: 680;
  cursor: pointer;
}
.swipe-action.edit { background: var(--blue); color: white; }
.swipe-action.delete { background: var(--red); color: white; }
.swipe-content {
  position: relative;
  z-index: 2;
  background: var(--surface);
  transition: transform 0.2s ease;
  box-shadow: 0 0 0 1px var(--surface);
}

.pay-status-badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 7px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 650;
  white-space: nowrap;
  vertical-align: middle;
}
.pay-status-badge.paid { background: var(--green-soft); color: var(--green); }
.pay-status-badge.unpaid { background: var(--orange-soft); color: var(--accent-strong); }
.pay-status-badge.settled { background: var(--green-soft); color: var(--green); }
.pay-status-badge.pending { background: var(--red-soft); color: var(--red); }

.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.search-field { position: relative; flex: 1; }
.search-field svg { position: absolute; left: 13px; top: 50%; width: 18px; height: 18px; color: var(--text-tertiary); transform: translateY(-50%); pointer-events: none; }
.search-field input {
  width: 100%;
  height: 44px;
  padding: 0 13px 0 40px;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: rgba(255,255,255,.82);
  color: var(--text);
  outline: none;
}
.circle-button { display: grid; place-items: center; flex: 0 0 44px; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 14px; background: var(--dark); color: #fff; cursor: pointer; }
.circle-button svg { width: 20px; height: 20px; }

.filter-row { display: flex; gap: 8px; margin: 0 -16px 14px; padding: 0 16px; overflow-x: auto; scrollbar-width: none; }
.filter-row::-webkit-scrollbar { display: none; }
.filter-chip { flex: none; min-height: 34px; padding: 0 13px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.72); color: var(--text-secondary); font-size: 12px; font-weight: 600; cursor: pointer; }
.filter-chip.is-active { border-color: var(--dark); background: var(--dark); color: #fff; }

.result-count { margin-bottom: 9px; color: var(--text-secondary); font-size: 11px; }
.product-list { display: grid; gap: 20px; }
.spec-group { display: grid; gap: 9px; }
.spec-group-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; padding: 0 3px; }
.spec-group-head h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.03em; }
.spec-group-head p { margin: 3px 0 0; color: var(--text-secondary); font-size: 10px; }
.spec-group-head > span { color: var(--text-secondary); font-size: 11px; white-space: nowrap; }
.spec-product-list { display: grid; gap: 10px; }
.product-card {
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--surface);
}
.product-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.product-identity { display: flex; min-width: 0; gap: 12px; }
.tire-symbol { position: relative; display: grid; place-items: center; flex: 0 0 46px; width: 46px; height: 46px; border: 7px solid #242426; border-radius: 50%; background: #c8c8cd; box-shadow: inset 0 0 0 5px #f4f4f6; }
.tire-symbol::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #6f6f75; }
.product-photo-button { flex: 0 0 46px; width: 46px; height: 46px; padding: 0; overflow: hidden; border: 0; border-radius: 14px; background: transparent; cursor: zoom-in; }
.product-photo { display: block; width: 100%; height: 100%; border-radius: 14px; object-fit: cover; background: rgba(118,118,128,.08); }
.product-photo-placeholder { display: grid; place-items: center; width: 100%; height: 100%; border-radius: 14px; background: rgba(118,118,128,.08); }
.product-photo-placeholder svg { width: 18px; height: 18px; color: rgba(118,118,128,.4); }
.product-copy { min-width: 0; }
.product-copy h3 { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 18px; font-weight: 700; letter-spacing: -0.03em; }
.product-copy p { margin: 5px 0 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-secondary); font-size: 12px; }
.stock-number { flex: none; text-align: right; }
.stock-number strong { display: block; font-size: 25px; font-weight: 720; letter-spacing: -0.04em; }
.stock-number small { color: var(--text-tertiary); font-size: 10px; }
.low-badge { display: inline-flex; margin-top: 4px; padding: 3px 7px; border-radius: 999px; background: var(--red-soft); color: var(--red); font-size: 9px; font-weight: 650; }
.product-meta { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; margin-top: 15px; }
.meta-cell { min-width: 0; padding: 10px; border-radius: 12px; background: rgba(118,118,128,.07); }
.meta-cell span { display: block; color: var(--text-tertiary); font-size: 9px; }
.meta-cell strong { display: block; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 650; }
.product-actions { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; margin-top: 13px; }

.button {
  min-height: 42px;
  padding: 0 15px;
  border: 0;
  border-radius: 13px;
  background: rgba(118,118,128,.1);
  color: var(--text);
  font-size: 13px;
  font-weight: 650;
  cursor: pointer;
}
.button.primary { background: var(--dark); color: #fff; }
.button.accent { background: var(--accent); color: #fff; }
.button.green { background: var(--green-soft); color: var(--green); }
.button.blue { background: var(--blue-soft); color: var(--blue); }
.button.danger { background: var(--red-soft); color: var(--red); }
.button.block { width: 100%; }
.icon-only { display: grid; place-items: center; width: 42px; padding: 0; }
.icon-only svg { width: 18px; height: 18px; }

.empty-state { padding: 44px 20px; text-align: center; color: var(--text-secondary); }
.empty-state .empty-icon { display: grid; place-items: center; width: 58px; height: 58px; margin: 0 auto 13px; border-radius: 19px; background: rgba(118,118,128,.08); color: var(--text-tertiary); }
.empty-state strong { display: block; color: var(--text); font-size: 15px; }
.empty-state p { margin: 6px 0 0; font-size: 12px; }

.settings-group { margin-top: 18px; }
.settings-group:first-of-type { margin-top: 0; }
.settings-title { margin: 0 0 8px 4px; color: var(--text-secondary); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }
.settings-card { overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); }
.settings-row { display: grid; grid-template-columns: 40px minmax(0,1fr) auto; align-items: center; gap: 11px; width: 100%; min-height: 62px; padding: 10px 14px; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; cursor: pointer; }
.settings-row:first-child { border-top: 0; }
.settings-row-icon { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 11px; background: var(--blue-soft); color: var(--blue); }
.settings-row-icon.orange { background: var(--accent-soft); color: var(--accent); }
.settings-row-icon.green { background: var(--green-soft); color: var(--green); }
.settings-row-icon.red { background: var(--red-soft); color: var(--red); }
.settings-row-icon svg { width: 18px; height: 18px; }
.settings-row strong { display: block; font-size: 13px; }
.settings-row small { display: block; margin-top: 3px; color: var(--text-secondary); font-size: 10px; }
.settings-value { color: var(--text-secondary); font-size: 12px; }

.bottom-nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 30;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  min-height: calc(70px + var(--safe-bottom));
  padding: 7px 6px var(--safe-bottom);
  background: rgba(249, 249, 249, 0.88);
  border-top: 1px solid var(--line);
  backdrop-filter: saturate(180%) blur(24px);
  -webkit-backdrop-filter: saturate(180%) blur(24px);
}
.nav-item { display: grid; place-items: center; align-content: center; gap: 3px; border: 0; background: transparent; color: var(--text-tertiary); font-size: 10px; font-weight: 600; cursor: pointer; }
.nav-item svg { width: 22px; height: 22px; }
.nav-item.is-active { color: var(--accent); }

.sheet-backdrop { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; padding-top: var(--safe-top); background: rgba(0,0,0,.34); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.sheet-backdrop[hidden] { display: none; }
.bottom-sheet { width: min(680px, 100%); max-height: min(88svh, 900px); overflow: hidden; border-radius: 26px 26px 0 0; background: #f9f9fb; box-shadow: 0 -20px 60px rgba(0,0,0,.2); animation: sheetUp .24s ease-out; }
@keyframes sheetUp { from { transform: translateY(28px); opacity: .7; } to { transform: none; opacity: 1; } }
.sheet-handle { width: 38px; height: 5px; margin: 8px auto 2px; border-radius: 999px; background: rgba(60,60,67,.22); }
.sheet-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px 13px; border-bottom: 1px solid var(--line); }
.sheet-eyebrow { display: block; margin-bottom: 3px; color: var(--text-tertiary); font-size: 9px; font-weight: 650; letter-spacing: .12em; text-transform: uppercase; }
.sheet-header h2 { margin: 0; font-size: 20px; letter-spacing: -0.03em; }
.close-button { display: grid; place-items: center; width: 34px; height: 34px; padding: 0; border: 0; border-radius: 50%; background: rgba(118,118,128,.12); color: var(--text-secondary); cursor: pointer; }
.close-button svg { width: 18px; height: 18px; }
.sheet-content { max-height: calc(88svh - 76px); overflow-y: auto; padding: 18px 18px calc(22px + var(--safe-bottom)); }

.form-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
.form-field { display: grid; gap: 7px; }
.form-field > span { color: var(--text-secondary); font-size: 12px; font-weight: 600; }
.form-field input, .form-field select, .form-field textarea {
  width: 100%;
  min-height: 46px;
  padding: 11px 13px;

.segmented { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 3px; border-radius: 12px; background: rgba(118,118,128,.12); }

.selected-product { display: grid; grid-template-columns: 46px minmax(0,1fr) auto; align-items: center; gap: 12px; margin-bottom: 16px; padding: 14px; border-radius: 17px; background: #fff; box-shadow: inset 0 0 0 1px var(--line); }

.divider { display: flex; align-items: center; gap: 10px; margin: 16px 0; color: var(--text-tertiary); font-size: 10px; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.sync-code { width: 100%; min-height: 120px; padding: 12px; border: 1px solid var(--line); border-radius: 13px; background: #fff; color: var(--text-secondary); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; word-break: break-all; resize: vertical; }
.notice { padding: 13px; border-radius: 14px; background: var(--blue-soft); color: #285b8f; font-size: 11px; line-height: 1.55; }

.image-lightbox { position: fixed; inset: 0; z-index: 90; display: grid; grid-template-rows: minmax(0,1fr) auto; place-items: center; gap: 14px; padding: calc(54px + var(--safe-top)) 18px calc(22px + var(--safe-bottom)); background: rgba(0,0,0,.94); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.image-lightbox img { display: block; max-width: 100%; max-height: calc(100svh - 130px - var(--safe-top) - var(--safe-bottom)); border-radius: 16px; object-fit: contain; }
.image-lightbox p { margin: 0; color: rgba(255,255,255,.82); font-size: 13px; text-align: center; }
.lightbox-close { position: absolute; top: calc(12px + var(--safe-top)); right: 14px; display: grid; place-items: center; width: 40px; height: 40px; padding: 0; border: 0; border-radius: 50%; background: rgba(255,255,255,.16); color: #fff; cursor: pointer; }

.toast {

  <script>
  // ===== 常量与配置 =====
  const STORAGE_KEY = 'tire-warehouse-state-v2';
  const CHANNEL_NAME = 'tire-warehouse-live-sync';
  const DB_NAME = 'TireWarehouseDB';
  const DB_VERSION = 1;
  const IMAGE_STORE_NAME = 'productImages';

  function openDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, DB_VERSION);
      request.onupgradeneeded = event => {
        const db = event.target.result;
        if (!db.objectStoreNames.contains(IMAGE_STORE_NAME)) {
          db.createObjectStore(IMAGE_STORE_NAME, { keyPath: 'id' });
        }
      };
      request.onsuccess = event => resolve(event.target.result);
      request.onerror = event => reject(event.target.error);
    });
  }

  async function saveProductImage(imageId, dataUrl) {
    if (!imageId || !dataUrl) return;
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IMAGE_STORE_NAME, 'readwrite');
      const store = tx.objectStore(IMAGE_STORE_NAME);
      const request = store.put({ id: imageId, dataUrl, createdAt: Date.now() });
      request.onsuccess = () => resolve();
      request.onerror = () => reject(request.error);
    });
  }

  async function getProductImage(imageId) {
    if (!imageId) return '';
    try {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IMAGE_STORE_NAME, 'readonly');
        const store = tx.objectStore(IMAGE_STORE_NAME);
        const request = store.get(imageId);
        request.onsuccess = () => resolve(request.result?.dataUrl || '');
        request.onerror = () => reject(request.error);
      });
    } catch {
      return '';
    }
  }

  async function deleteProductImage(imageId) {
    if (!imageId) return;
    try {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IMAGE_STORE_NAME, 'readwrite');
        const store = tx.objectStore(IMAGE_STORE_NAME);
        const request = store.delete(imageId);
        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
      });
    } catch {
      // ignore
    }
  }

  // 收入类别（补胎/调胎/充气/换备胎/打黄油/电焊/新胎/其他）
  const INCOME_CATEGORIES = [
    { key: '补胎', icon: 'circleDot' },
    { key: '调胎', icon: 'refresh' },
    { key: '充气', icon: 'wind' },
    { key: '换备胎', icon: 'disc' },
    { key: '打黄油', icon: 'wrench' },
    { key: '电焊', icon: 'zap' },
    { key: '新胎', icon: 'tire' },
    { key: '其他', icon: 'tag' }
  ];

  // 工作支出类别
  const WORK_EXPENSE_CATEGORIES = [
    { key: '新胎购买', icon: 'tire' },
    { key: '修补材料', icon: 'box' },
    { key: '工具', icon: 'wrench' },
    { key: '救援油费', icon: 'fuel' }
  ];

  // 生活支出类别
  const LIVING_EXPENSE_CATEGORIES = [
    { key: '加油', icon: 'fuel' },
    { key: '吃饭', icon: 'utensils' },
    { key: '转账红包', icon: 'gift' },
    { key: '零食', icon: 'coffee' },
    { key: '水电燃气', icon: 'zap' },

    const pad = n => String(n).padStart(2, '0');

    const m = pad(date.getMonth() + 1);
    const d = pad(date.getDate());
    const h = pad(date.getHours());
    const min = pad(date.getMinutes());
    return `${y}-${m}-${d}T${h}:${min}`;

  // ===== 状态归一化（处理新字段 accounting 和 transactions.payStatus） =====
  function hydrateState(value) {
    const safe = value && Array.isArray(value.products) && Array.isArray(value.transactions) ? value : clone(seedState);
    return {
      products: safe.products.map(product => {
        const image = String(product.image || '');
        const isDataUrl = image.startsWith('data:image/');
        return {
          id: String(product.id || makeId('T')),
          spec: String(product.spec || ''),
          brand: String(product.brand || ''),
          pattern: String(product.pattern || ''),
          stock: Math.max(0, Number(product.stock || 0)),
          purchasePrice: Math.max(0, Number(product.purchasePrice || 0)),
          notes: String(product.notes || ''),
          image: isDataUrl ? '' : image,
          imageData: isDataUrl ? image : '',
          updatedAt: product.updatedAt || nowISO()
        };
      }),
      transactions: safe.transactions.map(transaction => ({
        id: String(transaction.id || makeId('TX')),
        type: transaction.type === 'out' ? 'out' : 'in',
        productId: String(transaction.productId || ''),
        quantity: Math.max(0, Number(transaction.quantity || 0)),
        unitPrice: Math.max(0, Number(transaction.unitPrice || 0)),
        note: String(transaction.note || ''),
        date: transaction.date || nowISO(),
        afterStock: Math.max(0, Number(transaction.afterStock || 0)),
        // 旧数据兼容：默认已付清
        payStatus: transaction.payStatus === 'unpaid' ? 'unpaid' : 'paid',
        supplier: String(transaction.supplier || ''),
        // 保留已付金额字段（关键：不能丢失，否则会重置为 0 导致负数欠款异常）
        paidAmount: Math.max(0, Number(transaction.paidAmount || 0)),
        // 保留是否隐藏字段
        hidden: Boolean(transaction.hidden),
        // 兼容旧字段：保存原始规格品牌花纹（删除品牌款后流水仍可显示）
        spec: String(transaction.spec || ''),
        brand: String(transaction.brand || ''),
        pattern: String(transaction.pattern || '')
      })),
      // 新增 accounting 数组归一化，旧数据导入时为空数组
      accounting: Array.isArray(safe.accounting) ? safe.accounting.map(record => ({
        id: String(record.id || makeId('A')),
        type: record.type === 'expense' ? 'expense' : 'income',
        category: String(record.category || ''),
        amount: Math.max(0, Number(record.amount || 0)),
        note: String(record.note || ''),

        paymentStatus: record.paymentStatus === 'pending' ? 'pending' : 'settled',

        quantity: Math.max(0, Number(record.quantity || 0)),
        // 保留已收金额和隐藏标志
        paidAmount: Math.max(0, Number(record.paidAmount || 0)),
        hidden: Boolean(record.hidden),
        isRepayment: Boolean(record.isRepayment),
        relatedDebtId: String(record.relatedDebtId || '')
      })) : [],
      settings: {
        lowStockThreshold: Math.max(1, Number(safe.settings?.lowStockThreshold || 2))
      },
      updatedAt: safe.updatedAt || nowISO()
    };
  }

  function loadState() {
    try {
      const stored = localStorage.getItem(STORAGE_KEY);
      return stored ? hydrateState(JSON.parse(stored)) : hydrateState(clone(seedState));
    } catch (error) {
      return hydrateState(clone(seedState));
    }
  }

  // ===== 全局状态与 DOM 引用 =====
  let state = loadState();
  // 数据自动修复：修正入库记录的 payStatus 错误 + 恢复缺失字段
  function repairDebtStatus() {
    if (!state || !Array.isArray(state.transactions)) return false;
    let changed = false;
    state.transactions.forEach(t => {
      if (t.type !== 'in' || !t.payStatus) return;
      // 修复 1：paidAmount 字段缺失（兼容 hydrateState 修复前的数据）
      if (typeof t.paidAmount !== 'number') {
        t.paidAmount = 0;
        changed = true;
      }
      const total = Math.round((t.quantity * t.unitPrice) * 100) / 100;
      const paid = Math.round((Number(t.paidAmount) || 0) * 100) / 100;
      const remaining = Math.round((total - paid) * 100) / 100;
      if (t.payStatus === 'unpaid' && Math.abs(remaining) < 0.01) {
        t.payStatus = 'paid';
        t.paidAmount = total;
        changed = true;
      }
    });
    return changed;
  }

  async function persist({ broadcast = true, touchUpdatedAt = true } = {}) {
    const previousUpdatedAt = state.updatedAt;

        if (product.imageData) {

          delete product.imageData;

  // ===== 业务查询函数 =====

  function lowStockProducts() {
    return state.products.filter(product => product.stock < state.settings.lowStockThreshold);
  }

  function normalizeSkuPart(value) {
    return String(value || '').trim().replace(/\s+/g, ' ').toLocaleLowerCase('zh-CN');
  }

  function uniqueSpecCount(products = state.products) {
    return new Set(products.map(product => normalizeSkuPart(product.spec))).size;
  }

  function groupProductsBySpec(products) {
    const groups = new Map();
    products.forEach(product => {
      const key = normalizeSkuPart(product.spec);
      if (!groups.has(key)) groups.set(key, { spec: product.spec, products: [] });
      groups.get(key).products.push(product);
    });
    return [...groups.values()].sort((a, b) => a.spec.localeCompare(b.spec, 'zh-CN'));
  }

  // 库存欠款剩余：我欠公司/供应商的钱（type='in' && payStatus='unpaid'），减去已付金额
  function inventoryDebtTotal() {
    return state.transactions
      .filter(t => t.type === 'in' && t.payStatus === 'unpaid')
      .reduce((sum, t) => sum + t.quantity * t.unitPrice - (Number(t.paidAmount) || 0), 0);
  }

  // 收入欠款剩余：司机挂账欠我的钱（type='income' && paymentStatus='pending'），减去已收回金额
  function receivableDebtTotal() {
    return state.accounting
      .filter(a => a.type === 'income' && a.paymentStatus === 'pending')
      .reduce((sum, a) => sum + a.amount - (Number(a.paidAmount) || 0), 0);
  }

  // 今日已结清收入
  function todayIncome() {
    const today = new Date().toDateString();
    return state.accounting
      .filter(a => a.type === 'income' && a.paymentStatus === 'settled' && new Date(a.date).toDateString() === today)
      .reduce((sum, a) => sum + a.amount, 0);
  }

  // 月度 KPI（参考记账 App 的 calcMonthKPI）
  function monthKPI(date = new Date()) {
    const prefix = date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0');
    const monthRecords = state.accounting.filter(a => a.date && a.date.startsWith(prefix));
    let income = 0, pending = 0, workCost = 0, livingCost = 0;
    monthRecords.forEach(r => {
      if (r.type === 'income') {
        if (r.paymentStatus === 'settled') income += r.amount;
        else pending += r.amount;
      } else if (r.type === 'expense') {
        if (r.expenseType === 'work') workCost += r.amount;
        else if (r.expenseType === 'living') livingCost += r.amount;
      }
    });
    return { income, pending, workCost, livingCost, net: income - workCost };
  }

  function tireSalesSummary(period = 'month') {
    const now = new Date();
    const prefix = period === 'year'
      ? String(now.getFullYear())
      : now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
    const records = state.accounting.filter(a =>
      a.type === 'income' && a.category === '新胎' && a.date && a.date.startsWith(prefix)
    );
    const totalQty = records.reduce((sum, r) => sum + (Number(r.quantity) || 0), 0);
    const totalAmount = records.reduce((sum, r) => sum + (Number(r.amount) || 0), 0);
    const txCount = records.length;
    return { totalQty, totalAmount, txCount };
  }

          <span class="transaction-count ${transaction.type}">${isIn ? '+' : '-'}${integer(transaction.quantity)} 条<small>${isIn ? `${money(transaction.unitPrice)}/条` : `剩余 ${integer(transaction.afterStock)} 条`}</small></span>

  // 账目流水行
  function accountingRow(a) {
    const isIncome = a.type === 'income';
    const payBadge = isIncome ? (a.paymentStatus === 'pending'
      ? '<span class="pay-status-badge pending">挂账</span>'
      : '<span class="pay-status-badge settled">已结清</span>') : '';
    const typeLabel = isIncome ? '收入' : (a.expenseType === 'living' ? '生活支出' : a.expenseType === 'work' ? '工作支出' : '支出');
    return `<div class="swipe-container" data-swipe-id="${a.id}" data-swipe-type="accounting">
      <div class="swipe-actions">
        <button class="swipe-action edit" type="button" data-action="edit-accounting" data-id="${a.id}">修改</button>
        <button class="swipe-action delete" type="button" data-action="delete-accounting" data-id="${a.id}">删除</button>
      </div>
      <div class="swipe-content transaction-row" data-action="view-accounting-detail" data-id="${a.id}">
        <span class="transaction-icon ${isIncome ? 'income' : 'expense'}">${icon(isIncome ? 'money' : 'arrowUp')}</span>
        <span class="transaction-main"><strong>${escapeHtml(a.category)}${isIncome && a.vehicle ? ' · ' + escapeHtml(a.vehicle) : ''}</strong><small>${typeLabel} · ${escapeHtml(a.note || '无备注')} · ${formatDate(a.date)}${payBadge ? ' · ' + payBadge : ''}</small></span>
        <span class="transaction-count ${isIncome ? 'in' : 'out'}">${isIncome ? '+' : '-'}${money(a.amount)}</span>
      </div>
    </div>`;
  }

  // 合并最近流水（库存 + 账目，按时间倒序）
  function mergedActivityRows(limit = 6) {
    const items = [];
    state.transactions.filter(t => !t.hidden).forEach(t => {
      const product = productById(t.productId);
      const name = product ? `${product.spec} · ${product.brand}` : '已移除的轮胎';
      const isIn = t.type === 'in';
      const payBadge = isIn ? (t.payStatus === 'unpaid'
        ? '<span class="pay-status-badge unpaid">欠款</span>'
        : '<span class="pay-status-badge paid">已付</span>') : '';
      items.push({
        date: t.date,
        html: `<div class="swipe-container" data-swipe-id="${t.id}" data-swipe-type="transaction">
          <div class="swipe-actions">
            <button class="swipe-action edit" type="button" data-action="edit-transaction" data-id="${t.id}">修改</button>
            <button class="swipe-action delete" type="button" data-action="delete-transaction" data-id="${t.id}">删除</button>
          </div>
          <div class="swipe-content transaction-row">
            <span class="transaction-icon ${isIn ? '' : 'out'}">${icon(isIn ? 'arrowDown' : 'arrowUp')}</span>
            <span class="transaction-main"><strong>${escapeHtml(name)}</strong><small>${isIn ? '入库' : '出库'} · ${escapeHtml(t.note || '无备注')} · ${formatDate(t.date)}${payBadge ? ' · ' + payBadge : ''}</small></span>
            <span class="transaction-count ${t.type}">${isIn ? '+' : '-'}${integer(t.quantity)} 条<small>${isIn ? `${money(t.unitPrice)}/条` : `剩余 ${integer(t.afterStock)}`}</small></span>
          </div>
        </div>`
      });
    });
    state.accounting.filter(a => !a.hidden).forEach(a => items.push({ date: a.date, html: accountingRow(a) }));
    items.sort((a, b) => new Date(b.date) - new Date(a.date));
    const slice = items.slice(0, limit);
    if (!slice.length) {
      return `<div class="empty-state"><span class="empty-icon">${icon('receipt')}</span><strong>暂无流水记录</strong><p>完成一次入库、出库或记账后会显示在这里</p></div>`;
    }
    return slice.map(i => i.html).join('');
  }

  // ===== 今日收入明细（可选日期查看） =====

  function showIncomeDetailByDate(date) {
    const dateStr = date.toDateString();
    const records = state.accounting
      .filter(a => a.type === 'income' && new Date(a.date).toDateString() === dateStr)
      .sort((a, b) => new Date(b.date) - new Date(a.date));
    const settled = records.filter(r => r.paymentStatus === 'settled').reduce((s, r) => s + r.amount, 0);
    const pending = records.filter(r => r.paymentStatus === 'pending').reduce((s, r) => s + r.amount, 0);
    const dateLabel = new Intl.DateTimeFormat('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' }).format(date);

    const listHtml = records.length ? records.map(r => `<div class="debt-card">
      <span class="debt-icon" style="background:var(--green-soft);color:var(--green)">${icon('money')}</span>
      <span class="debt-main"><strong>${escapeHtml(r.category)}${r.vehicle ? ' · ' + escapeHtml(r.vehicle) : ''}</strong><small>${r.paymentStatus === 'settled' ? '已结清' : '挂账'} · ${formatDate(r.date)}${r.note ? ' · ' + escapeHtml(r.note) : ''}</small></span>
      <span class="debt-amount" style="color:var(--green)">+${money(r.amount)}</span>
    </div>`).join('') : `<div class="empty-state" style="padding:24px 12px"><span class="empty-icon">${icon('money')}</span><strong>当天无收入记录</strong><p>试试切换其他日期</p></div>`;

    const prevDay = new Date(date); prevDay.setDate(prevDay.getDate() - 1);
    const nextDay = new Date(date); nextDay.setDate(nextDay.getDate() + 1);
    const isToday = date.toDateString() === new Date().toDateString();

    openSheet('收入明细', dateLabel, `<div class="form-field" style="margin-bottom:12px">
      <span>选择日期</span>
      <div style="display:flex;gap:8px;align-items:center;margin-top:6px">
        <button class="circle-button" type="button" data-action="income-detail-prev" data-date="${prevDay.toISOString()}" aria-label="前一天">${icon('chevron')}<svg viewBox="0 0 24 24" style="transform:rotate(180deg)"><path d="m9 6 6 6-6 6"/></svg></button>
        <input type="date" name="incomeDetailDate" value="${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}" style="flex:1;text-align:center">
        <button class="circle-button" type="button" data-action="income-detail-next" data-date="${nextDay.toISOString()}" ${isToday ? 'disabled' : ''} aria-label="后一天">${icon('chevron')}</button>
      </div>
    </div>
    <div class="stat-grid" style="margin-bottom:12px">
      <article class="stat-card success"><div class="label"><span>已结清</span></div><div class="value" style="font-size:18px">${money(settled)}</div></article>
      <article class="stat-card danger"><div class="label"><span>挂账</span></div><div class="value" style="font-size:18px">${money(pending)}</div></article>
    </div>
    <div class="list-card">${listHtml}</div>
    <div class="form-actions" style="margin-top:14px"><button class="button" type="button" data-action="close-sheet">关闭</button></div>`);
  }

  // ===== 新胎销售明细 =====
  function showTireSalesDetail() {
    const period = homeSalesView;
    const now = new Date();
    const prefix = period === 'year'
      ? String(now.getFullYear())
      : now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
    const periodLabel = period === 'year' ? `${now.getFullYear()}年` : new Intl.DateTimeFormat('zh-CN', { year: 'numeric', month: 'long' }).format(now);
    const records = state.accounting
      .filter(a => a.type === 'income' && a.category === '新胎' && a.date && a.date.startsWith(prefix))
      .sort((a, b) => new Date(b.date) - new Date(a.date));
    const totalQty = records.reduce((sum, r) => sum + (Number(r.quantity) || 0), 0);
    const totalAmount = records.reduce((sum, r) => sum + (Number(r.amount) || 0), 0);
    const settledAmount = records.filter(r => r.paymentStatus === 'settled').reduce((sum, r) => sum + (Number(r.amount) || 0), 0);
    const pendingAmount = records.filter(r => r.paymentStatus === 'pending').reduce((sum, r) => sum + (Number(r.amount) || 0), 0);

    const listHtml = records.length ? records.map(r => {
      let tireLabel = '未知轮胎';
      if (r.productId && r.productId !== '__OTHER__') {
        const p = productById(r.productId);
        if (p) tireLabel = `${p.spec} · ${p.brand} · ${p.pattern}`;
      } else if (r.otherSpec || r.otherBrand) {
        tireLabel = `${r.otherSpec || ''} · ${r.otherBrand || ''}`;
      } else if (r.note) {
        tireLabel = r.note;
      }
      return `<div class="transaction-row" style="cursor:pointer" data-action="view-accounting-detail" data-id="${escapeHtml(r.id)}">
        <span class="transaction-icon">${icon('tire')}</span>
        <span class="transaction-main"><strong>${escapeHtml(tireLabel)}${r.vehicle ? ' · ' + escapeHtml(r.vehicle) : ''}</strong><small>${r.paymentStatus === 'settled' ? '已结清' : '挂账'} · ${formatDate(r.date)} · ${Number(r.quantity) || 0} 条</small></span>
        <span class="transaction-count" style="color:var(--green)">+${money(r.amount)}</span>
      </div>`;
    }).join('') : `<div class="empty-state" style="padding:24px 12px"><span class="empty-icon">${icon('tire')}</span><strong>${periodLabel}暂无新胎销售记录</strong><p>在记账中记一笔"新胎"收入即可统计</p></div>`;

    openSheet('新胎销售明细', periodLabel, `<div class="segmented" style="margin-bottom:12px">
      <button type="button" class="${period === 'month' ? 'is-active' : ''}" data-action="toggle-sales-view" data-period="month">本月</button>
      <button type="button" class="${period === 'year' ? 'is-active' : ''}" data-action="toggle-sales-view" data-period="year">本年</button>
    </div>
    <article class="stat-card" style="background:var(--blue-soft);border-color:rgba(0,122,255,.18);margin-bottom:11px">
      <div class="label"><span>销售新胎总数</span><span class="mini-icon blue">${icon('tire')}</span></div>
      <div class="value" style="color:var(--blue)">${integer(totalQty)}<small> 条</small></div>
    </article>
    <div class="stat-grid" style="margin-bottom:12px">
      <article class="stat-card success"><div class="label"><span>已结清</span></div><div class="value" style="font-size:16px">${money(settledAmount)}</div></article>
      <article class="stat-card danger"><div class="label"><span>挂账</span></div><div class="value" style="font-size:16px">${money(pendingAmount)}</div></article>
    </div>
    <div class="list-card">${listHtml}</div>
    <div class="form-actions" style="margin-top:14px"><button class="button" type="button" data-action="close-sheet">关闭</button></div>`);
  }

  // ===== 视图渲染：库存 =====
  function filteredProducts() {
    const query = searchQuery.trim().toLowerCase();
    return state.products
      .filter(product => {
        if (inventoryFilter === 'low' && product.stock >= state.settings.lowStockThreshold) return false;
        if (inventoryFilter === 'empty' && product.stock !== 0) return false;
        if (!query) return true;
        return [product.spec, product.brand, product.pattern, product.notes].join(' ').toLowerCase().includes(query);
      })
      .sort((a, b) => a.spec.localeCompare(b.spec, 'zh-CN') || a.brand.localeCompare(b.brand, 'zh-CN') || a.pattern.localeCompare(b.pattern, 'zh-CN'));
  }

  function productCards(products) {
    if (!products.length) {
      return `<div class="empty-state"><span class="empty-icon">${icon('search')}</span><strong>没有找到轮胎</strong><p>可以调整筛选条件或新增一个品牌款</p></div>`;
    }
    return groupProductsBySpec(products).map(group => {
      const groupStock = group.products.reduce((sum, product) => sum + product.stock, 0);
      const brandCount = new Set(group.products.map(product => normalizeSkuPart(product.brand))).size;
      return `<section class="spec-group">
        <div class="spec-group-head"><div><h2>${escapeHtml(group.spec)}</h2><p>${brandCount} 个品牌 · ${group.products.length} 个花纹款</p></div><span>共 ${integer(groupStock)} 条</span></div>
        <div class="spec-product-list">${group.products.map(product => {
          const isLow = product.stock < state.settings.lowStockThreshold;
          return `<article class="product-card">
      <div class="product-top">
        <div class="product-identity">${productVisual(product)}<div class="product-copy"><h3>${escapeHtml(product.brand)}</h3><p>花纹 ${escapeHtml(product.pattern)}</p></div></div>
        <div class="stock-number"><strong>${integer(product.stock)}</strong><small>库存 / 条</small>${isLow ? '<span class="low-badge">库存不足</span>' : ''}</div>
      </div>
      <div class="product-meta">
        <div class="meta-cell"><span>进货价</span><strong>${money(product.purchasePrice)}</strong></div>
        <div class="meta-cell"><span>备注</span><strong>${escapeHtml(product.notes || '暂无备注')}</strong></div>
      </div>
      <div class="product-actions">
        <button class="button green" type="button" data-action="stock-in" data-product-id="${escapeHtml(product.id)}">入库</button>
        <button class="button blue" type="button" data-action="stock-out" data-product-id="${escapeHtml(product.id)}" ${product.stock === 0 ? 'disabled' : ''}>出库</button>
        <button class="button icon-only" type="button" data-action="edit-product" data-product-id="${escapeHtml(product.id)}" aria-label="编辑 ${escapeHtml(product.spec)} ${escapeHtml(product.brand)} ${escapeHtml(product.pattern)}">${icon('edit')}</button>
        <button class="button icon-only danger" type="button" data-action="delete-product" data-product-id="${escapeHtml(product.id)}" aria-label="删除 ${escapeHtml(product.spec)} ${escapeHtml(product.brand)} ${escapeHtml(product.pattern)}">${icon('trash')}</button>
      </div>
    </article>`;
        }).join('')}</div>
      </section>`;
    }).join('');
  }

  function renderInventory() {
    main.innerHTML = `${pageHeading('轮胎库存', '按规格、品牌或花纹快速查找')}
    <div class="toolbar">
      <label class="search-field"><span class="sr-only">搜索轮胎</span>${icon('search')}<input id="inventorySearch" type="search" value="${escapeHtml(searchQuery)}" placeholder="搜索规格、品牌、花纹或备注"></label>

  function updateInventoryResults() {
    const products = filteredProducts();

    if (count) count.textContent = `共 ${uniqueSpecCount(products)} 个规格，${products.length} 个品牌花纹款`;
    if (list) list.innerHTML = productCards(products);
  }

  // ===== 视图渲染：流水（合并显示） =====
  function renderRecordsList() {
    const dateMatch = itemDate => !recordsDateFilter || new Date(itemDate).toDateString() === recordsDate.toDateString();
    const filterByDate = arr => arr.filter(item => dateMatch(item.date));
    const searchMatch = (text) => !recordsSearchQuery || text.toLowerCase().includes(recordsSearchQuery.toLowerCase());

    if (recordsSearchQuery) {
      const searchResults = [];
      state.transactions.filter(t => !t.hidden && dateMatch(t.date)).forEach(t => {
        const product = productById(t.productId);
        const name = product ? `${product.spec} · ${product.brand} · ${product.pattern}` : (t.spec && t.brand ? `${t.spec} · ${t.brand} · ${t.pattern}` : '已移除的轮胎');
        const searchText = `${name} ${t.note || ''} ${t.supplier || ''}`;
        if (searchMatch(searchText)) {
          searchResults.push({ date: t.date, html: transactionRowHtml(t, name) });
        }
      });
      state.accounting.filter(a => !a.hidden && dateMatch(a.date)).forEach(a => {
        const searchText = `${a.category} ${a.vehicle || ''} ${a.note || ''}`;
        if (searchMatch(searchText)) {
          searchResults.push({ date: a.date, html: accountingRow(a) });
        }
      });
      searchResults.sort((a, b) => new Date(b.date) - new Date(a.date));
      return searchResults.length ? searchResults.map(i => i.html).join('') : `<div class="empty-state"><span class="empty-icon">${icon('search')}</span><strong>没有找到匹配的流水记录</strong><p>试试其他关键词</p></div>`;
    } else if (recordsFilter === 'all') {
      if (recordsDateFilter) {
        const txs = filterByDate(state.transactions.filter(t => !t.hidden));
        const accs = filterByDate(state.accounting.filter(a => !a.hidden));
        const items = [];
        txs.forEach(t => {
          const product = productById(t.productId);
          const name = product ? `${product.spec} · ${product.brand}` : '已移除的轮胎';
          items.push({ date: t.date, html: transactionRowHtml(t, name) });
        });
        accs.forEach(a => items.push({ date: a.date, html: accountingRow(a) }));
        items.sort((a, b) => new Date(b.date) - new Date(a.date));
        return items.length ? items.map(i => i.html).join('') : `<div class="empty-state"><span class="empty-icon">${icon('receipt')}</span><strong>当天无流水记录</strong><p>试试切换其他日期或取消日期筛选</p></div>`;
      } else {
        return mergedActivityRows(9999);
      }
    } else if (recordsFilter === 'inventory') {
      let items = state.transactions.filter(t => !t.hidden).slice().sort((a, b) => new Date(b.date) - new Date(a.date));
      if (recordsDateFilter) items = filterByDate(items);
      return transactionRows(items);
    } else if (recordsFilter === 'income') {
      let items = state.accounting.filter(a => !a.hidden && a.type === 'income').sort((a, b) => new Date(b.date) - new Date(a.date));
      if (recordsDateFilter) items = filterByDate(items);
      return items.length ? items.map(a => accountingRow(a)).join('') : `<div class="empty-state"><span class="empty-icon">${icon('receipt')}</span><strong>${recordsDateFilter ? '当天无收入记录' : '暂无收入记录'}</strong><p>${recordsDateFilter ? '试试切换其他日期或取消日期筛选' : '在记账页面记一笔后会显示在这里'}</p></div>`;
    } else if (recordsFilter === 'expense') {
      let items = state.accounting.filter(a => !a.hidden && a.type === 'expense').sort((a, b) => new Date(b.date) - new Date(a.date));
      if (recordsDateFilter) items = filterByDate(items);
      return items.length ? items.map(a => accountingRow(a)).join('') : `<div class="empty-state"><span class="empty-icon">${icon('receipt')}</span><strong>${recordsDateFilter ? '当天无支出记录' : '暂无支出记录'}</strong><p>${recordsDateFilter ? '试试切换其他日期或取消日期筛选' : '在记账页面记一笔后会显示在这里'}</p></div>`;
    }
    return '';
  }

  // ===== 主渲染函数 =====
  // 图片加载缓存：避免重复读取 IndexedDB
  const imageCache = new Map();

  async function lazyLoadImages() {
    const buttons = document.querySelectorAll('.product-photo-button[data-image-id]:not([data-loaded])');
    if (!buttons.length) return;

    // 并行加载所有图片，限制并发数为 6
    const tasks = Array.from(buttons).map(button => {
      const imageId = button.dataset.imageId;
      if (!imageId) return Promise.resolve();
      // 优先使用缓存
      if (imageCache.has(imageId)) {
        const cached = imageCache.get(imageId);
        if (cached) {
          button.innerHTML = `<img class="product-photo" src="${cached}" alt="轮胎图片">`;
          button.dataset.loaded = 'true';
        }
        return Promise.resolve();
      }
      return getProductImage(imageId).then(dataUrl => {
        imageCache.set(imageId, dataUrl);
        if (dataUrl) {
          button.innerHTML = `<img class="product-photo" src="${dataUrl}" alt="轮胎图片">`;
          button.dataset.loaded = 'true';
        }
      });
    });

    // 分批并行，每批 6 个
    const BATCH_SIZE = 6;
    for (let i = 0; i < tasks.length; i += BATCH_SIZE) {
      await Promise.all(tasks.slice(i, i + BATCH_SIZE));
    }
  }

  function blobToDataUrl(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(reader.error || new Error('图片读取失败'));
      reader.readAsDataURL(blob);
    });
  }

  async function compressProductImage(file) {
    if (!file?.type?.startsWith('image/')) throw new Error('请选择图片文件');
    if (file.size > 15 * 1024 * 1024) throw new Error('图片不能超过 15MB');
    const objectUrl = URL.createObjectURL(file);
    try {
      const imageElement = await new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error('无法读取这张图片'));
        image.src = objectUrl;
      });
      const longestSide = Math.max(imageElement.naturalWidth, imageElement.naturalHeight);
      const scale = Math.min(1, 400 / Math.max(1, longestSide));
      const width = Math.max(1, Math.round(imageElement.naturalWidth * scale));
      const height = Math.max(1, Math.round(imageElement.naturalHeight * scale));
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext('2d');
      context.drawImage(imageElement, 0, 0, width, height);
      let quality = 0.6;
      let blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
      while (blob && blob.size > 60 * 1024 && quality > 0.25) {
        quality -= 0.06;
        blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
      }
      if (!blob) throw new Error('图片压缩失败');
      return blobToDataUrl(blob);
    } finally {
      URL.revokeObjectURL(objectUrl);
    }
  }

  const FIXED_TOP_SPEC = '12R22.5';
  const FIXED_BOTTOM_SPECS = ['275.80-22.5', '295.60-22.5', '295.80-22.5', '20.5-70-16'];

  function getProductSortKey(product) {
    const spec = String(product.spec || '');
    if (spec === FIXED_TOP_SPEC) return '0:' + spec;
    if (FIXED_BOTTOM_SPECS.includes(spec)) return '2:' + FIXED_BOTTOM_SPECS.indexOf(spec);
    return '1:' + spec;
  }

  function sortedProducts() {
    return [...state.products].sort((a, b) => {
      return getProductSortKey(a).localeCompare(getProductSortKey(b), 'zh-CN');
    });
  }

  function productOptions(selectedId = '', options = {}) {
    const { includeOther = false, otherSelected = false } = options;
    let html = sortedProducts().map(product => `<option value="${escapeHtml(product.id)}" ${product.id === selectedId ? 'selected' : ''}>${escapeHtml(product.spec)} · ${escapeHtml(product.brand)} ${escapeHtml(product.pattern)}（${product.stock}条）</option>`).join('');
    if (includeOther) {
      html += `<option value="__OTHER__" ${otherSelected ? 'selected' : ''}>其他（非库存轮胎）</option>`;
    }
    return html;
  }

  // ===== 流水详情查看 =====
  function openTransactionDetail(tx) {
    const product = productById(tx.productId);
    const name = product ? `${product.spec} · ${product.brand} · ${product.pattern}` : (tx.spec && tx.brand ? `${tx.spec} · ${tx.brand} · ${tx.pattern}` : '已移除的轮胎');
    const isIn = tx.type === 'in';
    const totalAmount = tx.quantity * tx.unitPrice;
    const paidAmount = Number(tx.paidAmount) || 0;
    const remaining = totalAmount - paidAmount;
    const detailRows = [
      ['类型', isIn ? '入库' : '出库'],
      ['轮胎', name],
      ['数量', `${integer(tx.quantity)} 条`],
      ['单价', `${money(tx.unitPrice)}/条`],
      ['总金额', money(totalAmount)]
    ];
    if (isIn) {
      detailRows.push(['供应商', tx.supplier || '未填写']);
      detailRows.push(['付款状态', tx.payStatus === 'unpaid' ? '欠款' : '已付清']);
      detailRows.push(['已付金额', money(paidAmount)]);
      if (Math.abs(remaining) > 0.01) {
        detailRows.push(['剩余欠款', money(remaining)]);
      }
    }
    detailRows.push(['入库后库存', `${integer(tx.afterStock)} 条`]);
    detailRows.push(['时间', formatDate(tx.date)]);
    if (tx.note) detailRows.push(['备注', tx.note]);

    openSheet('流水详情', isIn ? '入库记录' : '出库记录', `
      <div class="detail-list">
        ${detailRows.map(([label, value]) => `<div class="detail-row"><span class="detail-label">${escapeHtml(label)}</span><span class="detail-value">${escapeHtml(value)}</span></div>`).join('')}
      </div>
      <div class="form-actions" style="margin-top:16px">
        <button class="button" type="button" data-action="close-sheet">关闭</button>
        <button class="button blue" type="button" data-action="edit-transaction" data-id="${tx.id}">修改</button>
      </div>
    `);
  }

  function openAccountingDetail(acc) {
    const isIncome = acc.type === 'income';
    const paidAmount = Number(acc.paidAmount) || 0;
    const remaining = acc.amount - paidAmount;
    const typeLabel = isIncome ? '收入' : (acc.expenseType === 'living' ? '生活支出' : acc.expenseType === 'work' ? '工作支出' : '支出');
    const detailRows = [
      ['类型', typeLabel],
      ['类别', acc.category]
    ];
    if (isIncome && acc.vehicle) detailRows.push(['车牌号', acc.vehicle]);
    if (acc.productId && acc.productId !== '__OTHER__' && acc.quantity > 0) {
      const product = productById(acc.productId);
      detailRows.push(['轮胎', product ? `${product.spec} · ${product.brand} · ${product.pattern}` : '已移除的轮胎']);
      detailRows.push(['销售数量', `${integer(acc.quantity)} 条`]);
    } else if (acc.otherSpec && acc.otherBrand) {
      detailRows.push(['轮胎', `${acc.otherSpec} · ${acc.otherBrand}`]);
      detailRows.push(['销售数量', `${integer(acc.quantity)} 条`]);
    }
    detailRows.push(['金额', money(acc.amount)]);
    if (isIncome) {
      detailRows.push(['支付状态', acc.paymentStatus === 'pending' ? '挂账' : '已结清']);
      detailRows.push(['已收金额', money(paidAmount)]);
      if (Math.abs(remaining) > 0.01) {
        detailRows.push(['剩余应收', money(remaining)]);
      }
    }
    detailRows.push(['时间', formatDate(acc.date)]);
    if (acc.note) detailRows.push(['备注', acc.note]);

    openSheet('流水详情', isIncome ? '收入记录' : '支出记录', `
      <div class="detail-list">
        ${detailRows.map(([label, value]) => `<div class="detail-row"><span class="detail-label">${escapeHtml(label)}</span><span class="detail-value">${escapeHtml(value)}</span></div>`).join('')}
      </div>
      <div class="form-actions" style="margin-top:16px">
        <button class="button" type="button" data-action="close-sheet">关闭</button>
        <button class="button ${isIncome ? 'green' : 'blue'}" type="button" data-action="edit-accounting" data-id="${acc.id}">修改</button>
      </div>
    `);
  }

  // ===== 入库/出库表单（新增付款状态切换） =====
  function openMovementForm(type = 'in', productId = '', tx = null) {
    if (!state.products.length) {
      openProductForm();
      showToast('请先新增一个轮胎品牌款');
      return;
    }
    const isEdit = !!tx;
    const selected = productById(productId) || state.products[0];
    const productLocked = Boolean(productId);
    const defaultDate = tx && tx.date ? toDateTimeLocal(new Date(tx.date)) : toDateTimeLocal(new Date());
    const defaultQty = tx?.quantity || 1;
    const defaultPrice = tx?.unitPrice || selected.purchasePrice;
    const defaultSupplier = tx?.supplier || '';
    const defaultPayStatus = tx?.payStatus || 'paid';
    const defaultNote = tx?.note || '';
    openSheet((isEdit ? '编辑' : '') + (type === 'in' ? '轮胎入库' : '轮胎出库'), '库存变动', `<form id="movementForm">
    <input type="hidden" name="movementType" id="movementType" value="${type}">
    ${isEdit ? `<input type="hidden" name="txId" value="${escapeHtml(tx.id)}">` : ''}
    <div class="segmented" aria-label="出入库类型">
      <button class="${type === 'in' ? 'is-active' : ''}" type="button" data-action="set-movement-type" data-type="in">入库</button>
      <button class="${type === 'out' ? 'is-active' : ''}" type="button" data-action="set-movement-type" data-type="out">出库</button>
    </div>
    ${productLocked ? `<input type="hidden" name="productId" id="movementProduct" value="${escapeHtml(selected.id)}"><div class="selected-product">${productVisual(selected)}<span><strong>${escapeHtml(selected.spec)}</strong><small>${escapeHtml(selected.brand)} · ${escapeHtml(selected.pattern)}</small></span><span class="stock">${selected.stock}<small>当前库存</small></span></div>` : `<label class="form-field" style="margin-top:14px"><span>选择轮胎品牌款 *</span><select name="productId" id="movementProduct" required>${productOptions(selected.id)}</select></label><p class="form-hint" id="movementStockText">当前库存 ${selected.stock} 条</p>`}
    <div class="form-grid two-column" style="margin-top:14px">
      <label class="form-field"><span>数量 *</span><span class="input-with-unit"><input name="quantity" required autofocus type="number" min="1" step="1" value="${integer(defaultQty)}"><span>条</span></span></label>
      <label class="form-field" id="movementPriceField" ${type === 'out' ? 'hidden' : ''}><span>本次进货价 *</span><span class="input-with-unit"><input id="movementPrice" name="unitPrice" ${type === 'in' ? 'required' : ''} type="number" min="0" step="0.01" value="${money(defaultPrice)}"><span>元</span></span></label>
    </div>
    <div class="form-field" id="movementSupplierField" style="margin-top:14px" ${type === 'out' ? 'hidden' : ''}>
      <span>供应商</span>
      <input name="supplier" type="text" placeholder="例如 朝阳经销商、老王轮胎批发" list="supplierList" autocomplete="off" value="${escapeHtml(defaultSupplier)}">
      <datalist id="supplierList">
        ${[...new Set(state.transactions.filter(t => t.type === 'in' && t.supplier).map(t => t.supplier))].map(s => `<option value="${escapeHtml(s)}">`).join('')}
      </datalist>
      <p class="form-hint">填写供应商名称，方便按供应商查看欠款。</p>
    </div>
    <div class="form-field" id="movementPayStatusField" style="margin-top:14px" ${type === 'out' ? 'hidden' : ''}>
      <span>付款状态</span>
      <div class="segmented" id="payStatusSegmented">
        <button type="button" ${defaultPayStatus === 'paid' ? 'class="is-active"' : ''} data-action="set-pay-status" data-status="paid">已付清</button>
        <button type="button" ${defaultPayStatus === 'unpaid' ? 'class="is-active"' : ''} data-action="set-pay-status" data-status="unpaid">欠款</button>
      </div>
      <input type="hidden" name="payStatus" id="payStatusInput" value="${defaultPayStatus}">
      <p class="form-hint">选"欠款"时，本笔入库金额会进入库存欠款（应付）统计。</p>
    </div>
    <label class="form-field" style="margin-top:14px"><span>时间</span><input name="recordDate" type="datetime-local" value="${defaultDate}"></label>
    <label class="form-field" style="margin-top:14px"><span>备注</span><input name="note" placeholder="例如 首次进货、补货" value="${escapeHtml(defaultNote)}"></label>
    <p class="form-error" id="movementFormError" hidden></p>
    <div class="form-actions"><button class="button" type="button" data-action="close-sheet">取消</button><button class="button ${type === 'in' ? 'green' : 'blue'}" id="movementSubmit" type="submit">${isEdit ? '保存修改' : '确认' + (type === 'in' ? '入库' : '出库')}</button></div>
  </form>`);
  }

  function setMovementType(type) {
    const input = document.getElementById('movementType');
    const productSelect = document.getElementById('movementProduct');
    if (!input || !productSelect) return;
    input.value = type;
    document.querySelectorAll('[data-action="set-movement-type"]').forEach(button => button.classList.toggle('is-active', button.dataset.type === type));
    const product = productById(productSelect.value);
    const priceField = document.getElementById('movementPriceField');
    const priceInput = document.getElementById('movementPrice');
    if (priceField) priceField.hidden = type === 'out';
    if (priceInput) {
      priceInput.required = type === 'in';
      priceInput.value = product?.purchasePrice || 0;
    }
    const payStatusField = document.getElementById('movementPayStatusField');
    if (payStatusField) payStatusField.hidden = type === 'out';
    const supplierField = document.getElementById('movementSupplierField');
    if (supplierField) supplierField.hidden = type === 'out';
    const submit = document.getElementById('movementSubmit');
    if (submit) {
      submit.textContent = `确认${type === 'in' ? '入库' : '出库'}`;
      submit.className = `button ${type === 'in' ? 'green' : 'blue'}`;
    }
    sheetTitle.textContent = type === 'in' ? '轮胎入库' : '轮胎出库';
  }

  function updateMovementProduct() {
    const select = document.getElementById('movementProduct');
    const product = productById(select?.value);
    if (!product) return;
    const stockText = document.getElementById('movementStockText');
    if (stockText) stockText.textContent = `当前库存 ${product.stock} 条`;
    const price = document.getElementById('movementPrice');
    if (price) price.value = product.purchasePrice;
  }

  // ===== 记账表单 =====
  function openAccountingForm(type, category, expenseType = '', acc = null) {
    const isIncome = type === 'income';
    const isNewTire = isIncome && category === '新胎';
    const isEdit = !!acc;

    if (isNewTire && !state.products.length) {
      showToast('请先在库存中新增轮胎品牌款');
      return;
    }

    const defaultDate = acc && acc.date ? toDateTimeLocal(new Date(acc.date)) : toDateTimeLocal(new Date());
    const defaultAmount = acc?.amount || '';
    const defaultVehicle = acc?.vehicle || '';
    const defaultPaymentStatus = acc?.paymentStatus || 'settled';
    const defaultNote = acc?.note || '';
    const defaultProductId = acc?.productId || (state.products.length ? state.products[0].id : '');
    const defaultQuantity = acc?.quantity || 1;

    let extraFields = '';
    let otherSpecHidden = '';
    let otherBrandHidden = '';
    let isOtherSelected = defaultProductId === '__OTHER__';

      const defaultSelectedId = selected ? selected.id : '__OTHER__';
      extraFields = `
      <div class="form-grid two-column" style="margin-top:14px;align-items:end">

        <label class="form-field"><span>搜索型号/品牌</span><input id="accountingProductSearch" type="text" placeholder="输入型号或品牌快速筛选" autocomplete="off"></label>
      </div>
      <div class="form-grid two-column" style="margin-top:14px">
        <label class="form-field"><span>销售数量 *</span><span class="input-with-unit"><input name="quantity" type="number" min="1" step="1" value="${integer(defaultQuantity)}" required><span>条</span></span></label>
      </div>
      <p class="form-hint" id="accountingStockText">${selected ? `当前库存 ${selected.stock} 条。销售后会自动创建一条出库流水并扣减库存。` : '选择“其他”时不会扣减库存。'}</p>`;

        <label class="form-field"><span>轮胎型号 *</span><input name="otherSpec" id="accountingOtherSpec" placeholder="例如 12R22.5" value="${escapeHtml(acc?.otherSpec || '')}"></label>
        <label class="form-field"><span>品牌 *</span><input name="otherBrand" id="accountingOtherBrand" placeholder="例如 朝阳" value="${escapeHtml(acc?.otherBrand || '')}"></label>
      </div>`;
    }

    const sheetTitleText = (isEdit ? '编辑' : '记一笔') + (isIncome ? `收入 · ${category}` : `支出 · ${category}`);
    openSheet(sheetTitleText, isIncome ? '收入记账' : '支出记账', `<form id="accountingForm" novalidate>
    <input type="hidden" name="type" value="${type}">
    <input type="hidden" name="category" value="${escapeHtml(category)}">
    <input type="hidden" name="expenseType" value="${escapeHtml(expenseType)}">
    ${isEdit ? `<input type="hidden" name="accId" value="${escapeHtml(acc.id)}">` : ''}
    ${extraFields}
    ${otherSpecHidden}
    ${otherBrandHidden}
    ${isIncome ? `<label class="form-field" style="margin-top:14px"><span>车牌号</span><input name="vehicle" placeholder="例如 豫A12345（可选）" value="${escapeHtml(defaultVehicle)}"></label>` : ''}
    <div class="form-grid two-column" style="margin-top:14px">
      <label class="form-field"><span>金额 *</span><span class="input-with-unit"><input name="amount" type="number" min="0" step="0.01" required autofocus placeholder="0.00" value="${defaultAmount ? money(defaultAmount) : ''}"><span>元</span></span></label>
      ${isIncome ? `<label class="form-field"><span>支付状态</span><div class="segmented" id="paymentStatusSegmented"><button type="button" ${defaultPaymentStatus === 'settled' ? 'class="is-active"' : ''} data-action="set-payment-status" data-status="settled">已结清</button><button type="button" ${defaultPaymentStatus === 'pending' ? 'class="is-active"' : ''} data-action="set-payment-status" data-status="pending">挂账</button></div><input type="hidden" name="paymentStatus" id="paymentStatus" value="${defaultPaymentStatus}"></label>` : ''}
    </div>

    <label class="form-field" style="margin-top:14px"><span>备注</span><input name="note" placeholder="例如 ${isIncome ? '老客户' : '日常支出'}" value="${escapeHtml(defaultNote)}"></label>
    <p class="form-error" id="accountingFormError" hidden></p>
    <div class="form-actions"><button class="button" type="button" data-action="close-sheet">取消</button><button class="button ${isIncome ? 'green' : 'blue'}" type="submit">${isEdit ? '保存修改' : '确认记账'}</button></div>
  </form>`);
  }

  // ===== 欠款管理（库存欠款 - 应付） =====
  function openInventoryDebtManagement() {
    const invDebts = state.transactions.filter(t => t.type === 'in' && t.payStatus === 'unpaid')
      .sort((a, b) => new Date(b.date) - new Date(a.date));
    const invTotal = invDebts.reduce((s, t) => s + t.quantity * t.unitPrice, 0);
    const invPaid = invDebts.reduce((s, t) => s + (Number(t.paidAmount) || 0), 0);
    const invRemaining = invTotal - invPaid;

    const invGroups = new Map();
    invDebts.forEach(t => {
      const key = t.supplier || '未填写供应商';
      if (!invGroups.has(key)) invGroups.set(key, []);
      invGroups.get(key).push(t);
    });
    const invGroupList = [...invGroups.entries()].map(([supplier, items]) => {
      const total = items.reduce((s, t) => s + t.quantity * t.unitPrice, 0);
      const paid = items.reduce((s, t) => s + (Number(t.paidAmount) || 0), 0);
      const remaining = total - paid;
      return `<button class="debt-card" type="button" data-action="show-supplier-debt" data-supplier="${escapeHtml(supplier)}" style="cursor:pointer;width:100%;text-align:left;background:transparent;border:0;padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px">
        <span class="debt-icon" style="background:var(--orange-soft);color:var(--accent-strong)">${icon('box')}</span>
        <span class="debt-main"><strong>${escapeHtml(supplier)}</strong><small>共 ${items.length} 笔欠款 · 剩余 ${money(remaining)}</small></span>
        <span class="debt-amount" style="color:var(--accent-strong)">${money(remaining)}</span>
        <span class="chevron">${icon('chevron')}</span>
      </button>`;
    }).join('');

    openSheet('库存欠款（应付）', '我欠供应商的进货款', `<div class="debt-summary" style="grid-template-columns:1fr 1fr 1fr">
        <div class="debt-summary-cell warning">
          <div class="label">合计欠款</div>
          <div class="value">${money(invTotal)}</div>
        </div>
        <div class="debt-summary-cell">
          <div class="label">已付</div>
          <div class="value">${money(invPaid)}</div>
        </div>
        <div class="debt-summary-cell warning">
          <div class="label">剩余</div>
          <div class="value">${money(invRemaining)}</div>
        </div>
      </div>
      <div class="debt-section">
        ${invGroupList || `<div class="empty-state" style="padding:24px 12px"><span class="empty-icon">${icon('checkCircle')}</span><strong>暂无库存欠款</strong><p>所有进货款已付清</p></div>`}
      </div>
      <div class="form-actions" style="margin-top:14px"><button class="button" type="button" data-action="close-sheet">关闭</button></div>`);
  }

  // ===== 欠款管理（收入欠款 - 应收） =====
  function openReceivableDebtManagement() {
    const recDebts = state.accounting.filter(a => a.type === 'income' && a.paymentStatus === 'pending')
      .sort((a, b) => new Date(b.date) - new Date(a.date));
    const recTotal = recDebts.reduce((s, a) => s + a.amount, 0);
    const recPaid = recDebts.reduce((s, a) => s + (Number(a.paidAmount) || 0), 0);
    const recRemaining = recTotal - recPaid;

    const recGroups = new Map();
    recDebts.forEach(a => {
      const key = a.vehicle || '未填写车牌号';
      if (!recGroups.has(key)) recGroups.set(key, []);
      recGroups.get(key).push(a);
    });
    const recGroupList = [...recGroups.entries()].map(([vehicle, items]) => {
      const total = items.reduce((s, a) => s + a.amount, 0);
      const paid = items.reduce((s, a) => s + (Number(a.paidAmount) || 0), 0);
      const remaining = total - paid;
      return `<button class="debt-card" type="button" data-action="show-vehicle-debt" data-vehicle="${escapeHtml(vehicle)}" style="cursor:pointer;width:100%;text-align:left;background:transparent;border:0;padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px">
        <span class="debt-icon">${icon('money')}</span>
        <span class="debt-main"><strong>${escapeHtml(vehicle)}</strong><small>共 ${items.length} 笔挂账 · 剩余 ${money(remaining)}</small></span>
        <span class="debt-amount">${money(remaining)}</span>
        <span class="chevron">${icon('chevron')}</span>
      </button>`;
    }).join('');

    openSheet('收入欠款（应收）', '司机挂账欠我的钱', `<div class="debt-summary" style="grid-template-columns:1fr 1fr 1fr">
        <div class="debt-summary-cell danger">
          <div class="label">合计挂账</div>
          <div class="value">${money(recTotal)}</div>
        </div>
        <div class="debt-summary-cell">
          <div class="label">已收回</div>
          <div class="value">${money(recPaid)}</div>
        </div>
        <div class="debt-summary-cell danger">
          <div class="label">剩余</div>
          <div class="value">${money(recRemaining)}</div>
        </div>
      </div>
      <div class="debt-section">
        ${recGroupList || `<div class="empty-state" style="padding:24px 12px"><span class="empty-icon">${icon('checkCircle')}</span><strong>暂无收入欠款</strong><p>所有挂账已收回</p></div>`}
      </div>
      <div class="form-actions" style="margin-top:14px"><button class="button" type="button" data-action="close-sheet">关闭</button></div>`);
  }

  // 全屏欠款明细控制
  const debtDetailOverlay = document.getElementById('debtDetailOverlay');
  const debtDetailTitle = document.getElementById('debtDetailTitle');
  const debtDetailSubtitle = document.getElementById('debtDetailSubtitle');
  const debtDetailSummary = document.getElementById('debtDetailSummary');
  const debtDetailBody = document.getElementById('debtDetailBody');
  let currentDebtListCallback = null;

  function openDebtDetailFullScreen({ title, subtitle, summaryHtml, bodyHtml, onBack }) {
    debtDetailTitle.textContent = title;
    debtDetailSubtitle.textContent = subtitle || '';
    debtDetailSummary.innerHTML = summaryHtml;
    debtDetailBody.innerHTML = bodyHtml;
    debtDetailOverlay.hidden = false;
    document.body.style.overflow = 'hidden';
    currentDebtListCallback = onBack;
  }

  function closeDebtDetailFullScreen() {
    debtDetailOverlay.hidden = true;
    debtDetailBody.innerHTML = '';
    document.body.style.overflow = sheetBackdrop.hidden ? '' : 'hidden';
    currentDebtListCallback = null;
  }

  // 查看某供应商的欠款明细（全屏）
  function showSupplierDebtDetail(supplier) {
    const debts = state.transactions.filter(t => t.type === 'in' && t.payStatus === 'unpaid' && (t.supplier || '未填写供应商') === supplier)
      .sort((a, b) => new Date(b.date) - new Date(a.date));
    const total = debts.reduce((s, t) => s + t.quantity * t.unitPrice, 0);
    const paid = debts.reduce((s, t) => s + (Number(t.paidAmount) || 0), 0);
    const remaining = total - paid;
    const bodyHtml = debts.map(t => {
      const product = productById(t.productId);
      const name = t.spec && t.brand && t.pattern 
        ? `${t.spec} · ${t.brand} · ${t.pattern}`
        : (product ? `${product.spec} · ${product.brand} · ${product.pattern}` : '已移除的轮胎');
      const tTotal = t.quantity * t.unitPrice;
      const tPaid = Number(t.paidAmount) || 0;
      const tRemaining = tTotal - tPaid;
      return `<div class="detail-item">

  function deviceTransferPayload(includeImages = true) {
    return {
      products: state.products.map(product => includeImages ? product : { ...product, image: '' }),

      accounting: state.accounting,

  function bytesToBase64(bytes) {
    let binary = '';
    const chunkSize = 0x8000;
    for (let offset = 0; offset < bytes.length; offset += chunkSize) {
      binary += String.fromCharCode(...bytes.subarray(offset, offset + chunkSize));
    }
    return btoa(binary);
  }

  function base64ToBytes(value) {
    const binary = atob(value);
    return Uint8Array.from(binary, char => char.charCodeAt(0));
  }

  async function encodeSyncCode() {
    const bytes = new TextEncoder().encode(JSON.stringify(deviceTransferPayload(false)));
    if ('CompressionStream' in window) {
      const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'));
      const compressed = new Uint8Array(await new Response(stream).arrayBuffer());
      return `TWG2.${bytesToBase64(compressed)}`;
    }
    return `TW2.${bytesToBase64(bytes)}`;
  }

  async function decodeSyncCode(code) {
    const clean = code.replace(/\s/g, '');
    if (clean.startsWith('TWG2.') || clean.startsWith('TWG1.')) {
      if (!('DecompressionStream' in window)) throw new Error('当前浏览器不支持解压同步码');
      const compressed = base64ToBytes(clean.slice(5));
      const stream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
      const bytes = new Uint8Array(await new Response(stream).arrayBuffer());
      return JSON.parse(new TextDecoder().decode(bytes));
    }
    const rawCode = clean.startsWith('TW2.') ? clean.slice(4) : (clean.startsWith('TW1.') ? clean.slice(4) : clean);
    return JSON.parse(new TextDecoder().decode(base64ToBytes(rawCode)));
  }
