  function exportFullSyncFile() {
    const content = JSON.stringify(deviceTransferPayload(true));
    const blob = new Blob([content], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    const date = new Date().toISOString().slice(0, 10);
    link.href = url;
    link.download = `轮胎仓库完整同步-${date}.tirewarehouse.json`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast('完整同步文件已导出');
  }

  document.addEventListener('click', event => {

    if (nav) {
      switchView(nav.dataset.nav);
      return;
    }

    const filter = event.target.closest('[data-inventory-filter]');
    if (filter) {
      inventoryFilter = filter.dataset.inventoryFilter;
      renderInventory();
      return;
    }

    const transactionFilterButton = event.target.closest('[data-transaction-filter]');
    if (transactionFilterButton) {
      transactionFilter = transactionFilterButton.dataset.transactionFilter;
      renderRecords();
      return;
    }

    const recordsFilterButton = event.target.closest('[data-records-filter]');
    if (recordsFilterButton) {
      recordsFilter = recordsFilterButton.dataset.recordsFilter;
      renderRecords();
      return;
    }

    const actionButton = event.target.closest('[data-action]');
    if (!actionButton) return;
    const action = actionButton.dataset.action;
    const productId = actionButton.dataset.productId || '';

    if (action === 'add-product') openProductForm();
    if (action === 'edit-product') openProductForm(productById(productId));
    if (action === 'stock-in') openMovementForm('in', productId);
    if (action === 'stock-out') openMovementForm('out', productId);
    if (action === 'view-product-image') openProductImage(productId);
    if (action === 'close-sheet') closeSheet();
    if (action === 'remove-product-image') {
      pendingProductImage = '';
      renderProductImagePreview();

      if (status) status.textContent = '图片已移除，保存资料后生效。';
    }

    if (action === 'show-low-stock') { inventoryFilter = 'low'; switchView('inventory'); }
    if (action === 'go-accounting') switchView('accounting');
    if (action === 'show-today-income') openTodayIncomeDetail();
    if (action === 'toggle-records-date') { recordsDateFilter = !recordsDateFilter; if (recordsDateFilter) recordsDate = new Date(); renderRecords(); }
    if (action === 'records-date-prev') { recordsDate = new Date(recordsDate.getTime() - 86400000); renderRecords(); }
    if (action === 'records-date-next') { recordsDate = new Date(recordsDate.getTime() + 86400000); renderRecords(); }
    if (action === 'income-detail-prev') showIncomeDetailByDate(new Date(actionButton.dataset.date));
    if (action === 'income-detail-next') showIncomeDetailByDate(new Date(actionButton.dataset.date));
    if (action === 'show-supplier-debt') showSupplierDebtDetail(actionButton.dataset.supplier);
    if (action === 'show-vehicle-debt') showVehicleDebtDetail(actionButton.dataset.vehicle);
    if (action === 'set-accounting-mode') { accountingMode = actionButton.dataset.mode; renderAccounting(); }
    if (action === 'set-expense-type') { accountingExpenseType = actionButton.dataset.expenseType; renderAccounting(); }
    if (action === 'add-accounting') openAccountingForm(actionButton.dataset.type, actionButton.dataset.category, actionButton.dataset.expenseType || '');
    if (action === 'set-payment-status') {
      document.querySelectorAll('#paymentStatusSegmented button').forEach(b => b.classList.toggle('is-active', b.dataset.status === actionButton.dataset.status));
      const input = document.getElementById('paymentStatus');
      if (input) input.value = actionButton.dataset.status;
    }
    if (action === 'set-pay-status') {
      document.querySelectorAll('#payStatusSegmented button').forEach(b => b.classList.toggle('is-active', b.dataset.status === actionButton.dataset.status));
      const input = document.getElementById('payStatusInput');
      if (input) input.value = actionButton.dataset.status;
    }
    if (action === 'set-product-pay-status') {
      document.querySelectorAll('#productPayStatus button').forEach(b => b.classList.toggle('is-active', b.dataset.status === actionButton.dataset.status));
      const input = document.getElementById('productPayStatusInput');
      if (input) input.value = actionButton.dataset.status;
    }
    if (action === 'delete-product') {
      const productId = actionButton.dataset.productId;
      const product = state.products.find(p => p.id === productId);
      if (!product) return;
      const unpaidTransactions = state.transactions.filter(t => t.productId === productId && t.type === 'in' && t.payStatus === 'unpaid');
      const unpaidAmount = unpaidTransactions.reduce((s, t) => s + t.quantity * t.unitPrice - (Number(t.paidAmount) || 0), 0);
      let msg = '';
      if (product.stock > 0 && unpaidAmount > 0) {
        msg = `确定要删除 "${product.spec} ${product.brand} ${product.pattern}" 吗？当前库存 ${product.stock} 条将被清除，但欠款 ${money(unpaidAmount)} 将保留。`;
      } else if (product.stock > 0) {
        msg = `确定要删除 "${product.spec} ${product.brand} ${product.pattern}" 吗？当前库存 ${product.stock} 条也将被清除。`;
      } else if (unpaidAmount > 0) {
        msg = `确定要删除 "${product.spec} ${product.brand} ${product.pattern}" 吗？欠款 ${money(unpaidAmount)} 将保留。`;
      } else {
        msg = `确定要删除 "${product.spec} ${product.brand} ${product.pattern}" 吗？`;
      }
      if (!confirm(msg)) return;
      if (product.image) {
        deleteProductImage(product.image).catch(() => {});
      }
      state.products = state.products.filter(p => p.id !== productId);
      state.transactions = state.transactions.map(t => {
        if (t.productId === productId) {
          if (t.type === 'in' && t.payStatus === 'unpaid') {
            return { ...t, productId: '', spec: product.spec, brand: product.brand, pattern: product.pattern };
          }
          return null;
        }
        return t;
      }).filter(Boolean);
      persist();
      renderInventory();
      showToast('品牌款已删除');
    }
    if (action === 'manage-inventory-debts') openInventoryDebtManagement();
    if (action === 'manage-receivable-debts') openReceivableDebtManagement();
    if (action === 'debt-detail-back') {
      closeDebtDetailFullScreen();
      if (currentDebtListCallback) currentDebtListCallback();
    }
    if (action === 'settle-inventory-debt') {
      const tid = actionButton.dataset.transactionId;
      const tx = state.transactions.find(t => t.id === tid);
      if (tx) {
        const supplier = tx.supplier || '未填写供应商';
        const tTotal = tx.quantity * tx.unitPrice;
        const tPaid = Number(tx.paidAmount) || 0;
        const tRemaining = tTotal - tPaid;
        const input = prompt(`本次还款金额（剩余欠款 ${money(tRemaining)}，可多还）：`, String(tRemaining));
        if (input === null) return;
        const amount = Number(input);
        if (!Number.isFinite(amount) || amount <= 0) {
          showToast('请输入大于 0 的有效金额');
          return;
        }
        tx.paidAmount = tPaid + amount;
        const newRemaining = tTotal - tx.paidAmount;
        if (Math.abs(newRemaining) < 1e-9) {
          // 全部结清 → 删除欠款记录
          state.transactions = state.transactions.filter(t => t.id !== tid);
        } else if (newRemaining < 0) {
          // 多还 → 保留记录，显示负数欠款
          tx.payStatus = 'unpaid';
        }
        state.accounting.unshift({
          id: makeId('A'), type: 'expense', category: '新胎购买', expenseType: 'work',
          amount: amount,
          note: `还款 · ${supplier}${tx.spec ? ' · ' + tx.spec : ''}${tx.brand ? ' ' + tx.brand : ''}`,
          date: nowISO(),
          isRepayment: true,
          relatedDebtId: tid
        });
        persist();
        const remain = state.transactions.filter(t => t.type === 'in' && t.payStatus === 'unpaid' && (t.supplier || '未填写供应商') === supplier);
        if (remain.length) showSupplierDebtDetail(supplier);
        else { closeDebtDetailFullScreen(); openInventoryDebtManagement(); }
        showToast(Math.abs(newRemaining) < 1e-9 ? '已结清欠款' : newRemaining < 0 ? `已多还 ${money(-newRemaining)}，欠款显示为负数` : `已记一笔还款 ${money(amount)}`);
      }
    }
    if (action === 'settle-receivable-debt') {
      const aid = actionButton.dataset.accountingId;
      const acc = state.accounting.find(a => a.id === aid);
      if (acc) {
        const vehicle = acc.vehicle || '未填写车牌号';
        const aPaid = Number(acc.paidAmount) || 0;
        const aRemaining = acc.amount - aPaid;
        const input = prompt(`本次回款金额（剩余应收 ${money(aRemaining)}，可多收）：`, String(aRemaining));
        if (input === null) return;
        const amount = Number(input);
        if (!Number.isFinite(amount) || amount <= 0) {
          showToast('请输入大于 0 的有效金额');
          return;
        }
        acc.paidAmount = aPaid + amount;
        const newRemaining = acc.amount - acc.paidAmount;
        // 在收入中记录一笔回款（标记为已结清）
        state.accounting.unshift({
          id: makeId('A'),
          type: 'income',
          category: acc.category,
          amount: amount,
          vehicle: vehicle,
          note: `回款 · ${vehicle}${acc.note ? ' · 原账目：' + acc.note : ''}`,
          date: nowISO(),
          paymentStatus: 'settled',
          isRepayment: true,
          relatedDebtId: aid
        });
        if (Math.abs(newRemaining) < 1e-9) {
          // 全部结清 → 删除欠款记录
          state.accounting = state.accounting.filter(a => a.id !== aid);
        } else if (newRemaining < 0) {
          // 多收 → 保留记录，显示负数欠款
          acc.paymentStatus = 'pending';
        }
        persist();
        const remain = state.accounting.filter(a => a.type === 'income' && a.paymentStatus === 'pending' && (a.vehicle || '未填写车牌号') === vehicle);
        if (remain.length) showVehicleDebtDetail(vehicle);
        else { closeDebtDetailFullScreen(); openReceivableDebtManagement(); }
        showToast(Math.abs(newRemaining) < 1e-9 ? '已结清挂账' : newRemaining < 0 ? `已多收 ${money(-newRemaining)}，欠款显示为负数` : `已记一笔回款 ${money(amount)}`);
      }
    }
    if (action === 'low-stock-setting') openLowStockSetting();
    if (action === 'export-sync-file') exportFullSyncFile();
    if (action === 'import-sync-file') openImportSyncFile();
    if (action === 'show-tire-sales') showTireSalesDetail();
    if (action === 'toggle-sales-view') { homeSalesView = actionButton.dataset.period; showTireSalesDetail(); }
    if (action === 'view-transaction-detail') {
      const id = actionButton.dataset.id;
      const tx = state.transactions.find(t => t.id === id);
      if (tx) openTransactionDetail(tx);
    }
    if (action === 'view-accounting-detail') {
      const id = actionButton.dataset.id;
      const acc = state.accounting.find(a => a.id === id);
      if (acc) openAccountingDetail(acc);
    }
    if (action === 'edit-transaction') {
      const id = actionButton.dataset.id;
      const tx = state.transactions.find(t => t.id === id);
      if (tx) openMovementForm(tx.type, tx.productId, tx);
    }
    if (action === 'delete-transaction') {
      const id = actionButton.dataset.id;
      const tx = state.transactions.find(t => t.id === id);
      if (tx) {
        const tTotal = tx.quantity * tx.unitPrice;
        const tPaid = Number(tx.paidAmount) || 0;
        const tRemaining = tTotal - tPaid;
        const hasDebt = tx.type === 'in' && tx.payStatus === 'unpaid' && Math.abs(tRemaining) > 0.01;
        if (hasDebt) {
          const debtText = tRemaining > 0 
            ? `还有欠款未结清（剩余 ${money(tRemaining)}）` 
            : `还有预付款未用完（剩余 ${money(-tRemaining)}）`;
          if (!confirm(`${debtText}，是否删除？\n\n选择"确定"将从流水中删除，但欠款记录会保留。`)) return;
          tx.hidden = true;
          persist();
          render();
          showToast('已从流水删除，欠款已保留');
        } else {
          if (confirm(`确定删除这条${tx.type === 'in' ? '入库' : '出库'}记录吗？`)) {
            state.transactions = state.transactions.filter(t => t.id !== id);
            if (tx.type === 'out') {
              const product = productById(tx.productId);
              if (product) product.stock += tx.quantity;
            }
            persist();
            render();
            showToast('已删除');
          }
        }
      }
    }
    if (action === 'edit-accounting') {
      const id = actionButton.dataset.id;
      const acc = state.accounting.find(a => a.id === id);
      if (acc) {
        openAccountingForm(acc.type === 'income' ? 'income' : 'expense', acc.category, acc.expenseType || '', acc);
      }
    }
    if (action === 'delete-accounting') {
      const id = actionButton.dataset.id;
      const acc = state.accounting.find(a => a.id === id);
      if (acc) {
        const aPaid = Number(acc.paidAmount) || 0;
        const hasDebt = acc.type === 'income' && acc.paymentStatus === 'pending' && (acc.amount - aPaid) > 0;
        if (hasDebt) {
          if (!confirm(`还有欠款未结清（剩余应收 ${money(acc.amount - aPaid)}），是否删除？\n\n选择"确定"将从流水中删除，但欠款记录会保留直到结清。`)) return;
          acc.hidden = true;
          persist();
          render();
          showToast('已从流水删除，欠款已保留');
        } else {
          if (confirm(`确定删除这条${acc.type === 'income' ? '收入' : '支出'}记录吗？`)) {
            state.accounting = state.accounting.filter(a => a.id !== id);
            persist();
            render();
            showToast('已删除');
          }
        }
      }
    }
  });

  // ===== 事件：输入 =====
  document.addEventListener('input', event => {
    if (event.target.id === 'inventorySearch') {
      searchQuery = event.target.value;
      updateInventoryResults();
    }
    if (event.target.id === 'accountingProductSearch') {
      const keyword = String(event.target.value || '').trim().toLowerCase();
      const select = document.getElementById('accountingProduct');
      if (!select) return;
      const options = Array.from(select.options);
      options.forEach(option => {
        if (option.value === '__OTHER__') {
          option.hidden = false;
          return;
        }
        const text = option.textContent.toLowerCase();
        option.hidden = keyword.length > 0 && !text.includes(keyword);
      });
      const visible = options.filter(option => !option.hidden);
      if (visible.length && !visible.some(option => option.selected)) {
        visible[0].selected = true;
        select.dispatchEvent(new Event('change', { bubbles: true }));
      }
    }
  });

  // ===== 事件：滑动操作 =====
  let swipeStartX = 0;
  let swipeCurrentX = 0;
  let swipeTarget = null;
  let swipeContent = null;
  const SWIPE_THRESHOLD = 70;
  const SWIPE_MAX = 144;

  document.addEventListener('touchstart', event => {
    const content = event.target.closest('.swipe-content');
    if (!content) return;
    const container = content.parentElement;
    document.querySelectorAll('.swipe-container.is-open').forEach(c => {
      if (c !== container) {
        c.classList.remove('is-open');
        c.querySelector('.swipe-content').style.transform = 'translateX(0)';
      }
    });
    const touch = event.touches[0];
    swipeStartX = touch.clientX;
    swipeCurrentX = swipeStartX;
    swipeTarget = container;
    swipeContent = content;
    swipeContent.style.transition = 'none';
  }, { passive: true });

  document.addEventListener('touchmove', event => {
    if (!swipeContent) return;
    const touch = event.touches[0];
    swipeCurrentX = touch.clientX;
    const delta = swipeStartX - swipeCurrentX;
    const move = Math.max(0, Math.min(delta, SWIPE_MAX));
    swipeContent.style.transform = `translateX(-${move}px)`;
    if (delta > 10) {
      swipeTarget.classList.add('is-open');
    }
  }, { passive: true });

  document.addEventListener('touchend', () => {
    if (!swipeContent) return;
    const delta = swipeStartX - swipeCurrentX;
    swipeContent.style.transition = 'transform 0.2s ease';
    if (delta > SWIPE_THRESHOLD) {
      swipeContent.style.transform = `translateX(-${SWIPE_MAX}px)`;
      swipeTarget.classList.add('is-open');
    } else {
      swipeContent.style.transform = 'translateX(0)';
      swipeTarget.classList.remove('is-open');
    }
    swipeStartX = 0;
    swipeCurrentX = 0;
    swipeTarget = null;
    swipeContent = null;
  });

  document.addEventListener('click', event => {
    if (event.target.closest('.swipe-action')) return;
    document.querySelectorAll('.swipe-container.is-open').forEach(c => {
      c.classList.remove('is-open');
      c.querySelector('.swipe-content').style.transform = 'translateX(0)';
    });
  }, true);

  // ===== 事件：变更 =====
  document.addEventListener('change', async event => {
    if (event.target.name === 'incomeDetailDate') {
      const value = event.target.value;
      if (value) showIncomeDetailByDate(new Date(value + 'T00:00:00'));
    }
    if (event.target.name === 'recordsDate') {
      const value = event.target.value;
      if (value) { recordsDate = new Date(value + 'T00:00:00'); renderRecords(); }
    }
    if (event.target.id === 'movementProduct') updateMovementProduct();
    if (event.target.id === 'accountingProduct') {
      const value = event.target.value;
      const product = productById(value);
      const stockText = document.getElementById('accountingStockText');
      const otherFields = document.getElementById('accountingOtherFields');
      if (value === '__OTHER__') {
        if (stockText) stockText.textContent = '选择“其他”时不会扣减库存，请填写型号和品牌。';
        if (otherFields) otherFields.style.display = 'grid';
      } else {
        if (stockText && product) stockText.textContent = `当前库存 ${product.stock} 条。销售后会自动创建一条出库流水并扣减库存。`;
        if (otherFields) otherFields.style.display = 'none';
      }
    }
    if (event.target.id === 'productImageInput') {
      const file = event.target.files?.[0];
      if (!file) return;
      const status = document.getElementById('productImageStatus');
      const submit = document.querySelector('#productForm button[type="submit"]');
      if (status) status.textContent = '正在压缩图片，请稍候…';
      if (submit) submit.disabled = true;
      try {
        pendingProductImage = await compressProductImage(file);
        renderProductImagePreview();
        if (status) status.textContent = '图片已准备好，保存资料后生效。';
      } catch (imageError) {
        if (status) status.textContent = imageError.message || '图片处理失败，请换一张图试试。';
      } finally {
        if (submit) submit.disabled = false;
        event.target.value = '';
      }
    }
  });

  // ===== 事件：表单提交 =====
  document.addEventListener('submit', async event => {
    event.preventDefault();
    const form = event.target;

    // ----- 轮胎品牌款表单 -----
    if (form.id === 'productForm') {
      const data = new FormData(form);
      const id = data.get('productId');
      const spec = String(data.get('spec') || '').trim().replace(/\s+/g, ' ').toUpperCase();
      const brand = String(data.get('brand') || '').trim().replace(/\s+/g, ' ');
      const pattern = String(data.get('pattern') || '').trim().replace(/\s+/g, ' ');
      const purchasePriceText = String(data.get('purchasePrice') || '').trim();
      const purchasePrice = Number(purchasePriceText);
      const formError = document.getElementById('productFormError');
      if (!spec || !brand || !pattern || !purchasePriceText || !Number.isFinite(purchasePrice) || purchasePrice < 0) {
        formError.hidden = false;
        formError.textContent = '请完整填写轮胎规格、品牌、花纹和有效的进货价。';
        return;
      }
      const duplicate = state.products.some(product =>
        product.id !== id &&
        normalizeSkuPart(product.spec) === normalizeSkuPart(spec) &&
        normalizeSkuPart(product.brand) === normalizeSkuPart(brand) &&
        normalizeSkuPart(product.pattern) === normalizeSkuPart(pattern)
      );
      if (duplicate) {
        formError.hidden = false;
        formError.textContent = '这个“规格 + 品牌 + 花纹”已经存在，请直接编辑原有品牌款。';
        return;
      }
      const saveButton = form.querySelector('button[type="submit"]');
      const saveButtonText = saveButton?.textContent || '';
      if (saveButton) {
        saveButton.disabled = true;
        saveButton.textContent = '正在保存…';
      }
      const previousState = clone(state);
      const productData = {
        spec, brand, pattern, purchasePrice,
        notes: String(data.get('notes') || '').trim(),
        imageData: pendingProductImage,
        updatedAt: nowISO()
      };
      if (id) {
        const existing = state.products.find(p => p.id === id);
        if (pendingProductImage) {
          await deleteProductImage(existing?.image || '');
        }
        state.products = state.products.map(product => product.id === id ? { ...product, ...productData } : product);
      } else {
        const initialStock = Math.max(0, Number(data.get('initialStock') || 0));
        const newProduct = { id: makeId('T'), ...productData, stock: initialStock };
        state.products.unshift(newProduct);
        if (initialStock > 0) {
          const supplier = String(data.get('supplier') || '').trim();
          const payStatus = data.get('payStatus') === 'unpaid' ? 'unpaid' : 'paid';
          const recordDateRaw = String(data.get('recordDate') || '').trim();
          const recordDate = recordDateRaw ? new Date(recordDateRaw).toISOString() : nowISO();
          let txPaidAmount = 0;
          if (payStatus === 'unpaid' && supplier) {
            const supplierTx = state.transactions.filter(t => t.type === 'in' && t.payStatus === 'unpaid' && (t.supplier || '未填写供应商') === supplier);
            const currentDebt = supplierTx.reduce((sum, t) => sum + Math.round((t.quantity * t.unitPrice - (Number(t.paidAmount) || 0)) * 100) / 100, 0);
            const newDebt = Math.round(initialStock * newProduct.purchasePrice * 100) / 100;
            if (currentDebt < 0) {
              const offset = Math.round(Math.min(-currentDebt, newDebt) * 100) / 100;
              txPaidAmount = offset;
              let remainingOffset = offset;
              supplierTx.forEach(t => {
                if (remainingOffset <= 0.001) return;
                const tTotal = Math.round(t.quantity * t.unitPrice * 100) / 100;
                const tPaid = Math.round((Number(t.paidAmount) || 0) * 100) / 100;
                const tRemaining = Math.round((tTotal - tPaid) * 100) / 100;
                if (tRemaining < 0) {
                  const overpaid = -tRemaining;
                  const canOffset = Math.round(Math.min(remainingOffset, overpaid) * 100) / 100;
                  t.paidAmount = Math.round((tPaid - canOffset) * 100) / 100;
                  remainingOffset = Math.round((remainingOffset - canOffset) * 100) / 100;
                  if (Math.abs(t.paidAmount - tTotal) < 0.01) {
                    t.payStatus = 'paid';
                  }
                }
              });
            }
          }
          const finalTxPaidAmount = Math.round(txPaidAmount * 100) / 100;
          const finalRemaining = Math.round((initialStock * newProduct.purchasePrice - finalTxPaidAmount) * 100) / 100;
          const finalPayStatus = (finalRemaining <= 0.01) ? 'paid' : payStatus;
          state.transactions.unshift({ id: makeId('TX'), type: 'in', productId: newProduct.id, quantity: initialStock, unitPrice: newProduct.purchasePrice, note: '首次建档', date: recordDate, afterStock: initialStock, payStatus: finalPayStatus, supplier, paidAmount: finalTxPaidAmount });
          if (payStatus === 'paid' && initialStock * newProduct.purchasePrice > 0) {
            state.accounting.unshift({
              id: makeId('A'), type: 'expense', category: '新胎购买', expenseType: 'work',
              amount: initialStock * newProduct.purchasePrice,
              note: `入库自动记账 · ${newProduct.spec} ${newProduct.brand} ${newProduct.pattern} ${initialStock}条${supplier ? ' · ' + supplier : ''}`,
              date: recordDate
            });
          }
        }
      }
      try {
        await persist();
      } catch (error) {
        state = previousState;
        formError.hidden = false;
        formError.textContent = error.message || '保存失败，请稍后重试。';
        if (saveButton) { saveButton.disabled = false; saveButton.textContent = saveButtonText; }
        return;
      }
      pendingProductImage = '';
      closeSheet();
      switchView('inventory');
      showToast(id ? '轮胎品牌款已更新' : '轮胎品牌款已新增');
    }

    // ----- 入库/出库表单（含 payStatus 欠款字段） -----
    if (form.id === 'movementForm') {
      const data = new FormData(form);
      const type = data.get('movementType') === 'out' ? 'out' : 'in';
      const product = productById(String(data.get('productId')));
      const quantity = Math.max(0, Number(data.get('quantity') || 0));
      const unitPrice = type === 'in' ? Math.max(0, Number(data.get('unitPrice') || 0)) : 0;
      const error = document.getElementById('movementFormError');
      if (!product || quantity < 1 || !Number.isInteger(quantity)) {
        error.hidden = false;
        error.textContent = '请选择轮胎，并填写大于 0 的整数数量。';
        return;
      }
      const txId = String(data.get('txId') || '');
      const isEdit = !!txId;
      if (isEdit) {
        const oldTx = state.transactions.find(t => t.id === txId);
        if (oldTx) {
          product.stock += oldTx.type === 'in' ? -oldTx.quantity : oldTx.quantity;
        }
      }
      if (type === 'out' && quantity > product.stock) {
        error.hidden = false;
        error.textContent = `库存只有 ${product.stock} 条，无法出库 ${quantity} 条。`;
        return;
      }
      const payStatus = type === 'in' ? (data.get('payStatus') === 'unpaid' ? 'unpaid' : 'paid') : 'paid';
      const supplier = type === 'in' ? String(data.get('supplier') || '').trim() : '';
      const recordDateRaw = String(data.get('recordDate') || '').trim();
      const recordDate = recordDateRaw ? new Date(recordDateRaw).toISOString() : nowISO();
      product.stock += type === 'in' ? quantity : -quantity;
      product.updatedAt = nowISO();
      if (type === 'in') product.purchasePrice = unitPrice;
      const note = String(data.get('note') || '').trim();
      if (isEdit) {
        const txIndex = state.transactions.findIndex(t => t.id === txId);
        if (txIndex !== -1) {
          const oldTx = state.transactions[txIndex];
          state.transactions[txIndex] = {
            id: txId, type, productId: product.id, quantity, unitPrice,
            note, date: recordDate, afterStock: product.stock, payStatus, supplier,
            paidAmount: oldTx.paidAmount || 0,
            hidden: oldTx.hidden || false,
            isRepayment: oldTx.isRepayment || false,
            relatedDebtId: oldTx.relatedDebtId || '',
            spec: oldTx.spec || '',
            brand: oldTx.brand || '',
            pattern: oldTx.pattern || ''
          };
        }
      } else {
        let txPaidAmount = 0;
        if (type === 'in' && payStatus === 'unpaid' && supplier) {
          const supplierTx = state.transactions.filter(t => t.type === 'in' && t.payStatus === 'unpaid' && (t.supplier || '未填写供应商') === supplier);
          const currentDebt = supplierTx.reduce((sum, t) => sum + Math.round((t.quantity * t.unitPrice - (Number(t.paidAmount) || 0)) * 100) / 100, 0);
          const newDebt = Math.round(quantity * unitPrice * 100) / 100;
          if (currentDebt < 0) {
            const offset = Math.round(Math.min(-currentDebt, newDebt) * 100) / 100;
            txPaidAmount = offset;
            let remainingOffset = offset;
            supplierTx.forEach(t => {
              if (remainingOffset <= 0.001) return;
              const tTotal = Math.round(t.quantity * t.unitPrice * 100) / 100;
              const tPaid = Math.round((Number(t.paidAmount) || 0) * 100) / 100;
              const tRemaining = Math.round((tTotal - tPaid) * 100) / 100;
              if (tRemaining < 0) {
                const overpaid = -tRemaining;
                const canOffset = Math.round(Math.min(remainingOffset, overpaid) * 100) / 100;
                t.paidAmount = Math.round((tPaid - canOffset) * 100) / 100;
                remainingOffset = Math.round((remainingOffset - canOffset) * 100) / 100;
                if (Math.abs(t.paidAmount - tTotal) < 0.01) {
                  t.payStatus = 'paid';
                }
              }
            });
          }
        }
        const finalTxPaidAmount = Math.round(txPaidAmount * 100) / 100;
        const finalRemaining = Math.round((quantity * unitPrice - finalTxPaidAmount) * 100) / 100;
        const finalPayStatus = (finalRemaining <= 0.01) ? 'paid' : payStatus;
        state.transactions.unshift({
          id: makeId('TX'), type, productId: product.id, quantity, unitPrice,
          note, date: recordDate, afterStock: product.stock, payStatus: finalPayStatus, supplier,
          paidAmount: finalTxPaidAmount
        });
        if (type === 'in' && payStatus === 'paid' && quantity * unitPrice > 0) {
          state.accounting.unshift({
            id: makeId('A'), type: 'expense', category: '新胎购买', expenseType: 'work',
            amount: quantity * unitPrice,
            note: `入库自动记账 · ${product.spec} ${product.brand} ${product.pattern} ${quantity}条${supplier ? ' · ' + supplier : ''}`,
            date: recordDate
          });
        }
      }
      persist();
      closeSheet();
      render();
      const payHint = type === 'in' && payStatus === 'unpaid' ? '（已挂账）' : (type === 'in' && payStatus === 'paid' && !isEdit ? '（已记支出）' : '');
      showToast(`${product.spec} ${isEdit ? '已修改' : '已' + (type === 'in' ? '入库' : '出库')} ${quantity} 条${payHint}`);
    }

    // ----- 记账表单（收入/支出，含挂账与新胎销售联动库存） -----
    if (form.id === 'accountingForm') {
      const data = new FormData(form);
      const type = data.get('type') === 'expense' ? 'expense' : 'income';
      const category = String(data.get('category') || '').trim();
      const expenseType = String(data.get('expenseType') || '').trim();
      const isIncome = type === 'income';
      const amount = Number(data.get('amount') || 0);
      const error = document.getElementById('accountingFormError');
      if (!category || !Number.isFinite(amount) || amount <= 0) {
        error.hidden = false;
        error.textContent = '请填写有效的金额。';
        return;
      }
      const vehicle = String(data.get('vehicle') || '').trim();
      const note = String(data.get('note') || '').trim();
      const paymentStatus = isIncome ? (data.get('paymentStatus') === 'pending' ? 'pending' : 'settled') : 'settled';
      const recordDateRaw = String(data.get('recordDate') || '').trim();
      const recordDate = recordDateRaw ? new Date(recordDateRaw).toISOString() : nowISO();
      const accId = String(data.get('accId') || '');
      const isEdit = !!accId;

      if (isEdit) {
        const oldAcc = state.accounting.find(a => a.id === accId);
        if (oldAcc && oldAcc.productId && oldAcc.productId !== '__OTHER__' && oldAcc.quantity > 0) {
          const oldProduct = productById(oldAcc.productId);
          if (oldProduct) oldProduct.stock += oldAcc.quantity;
        }
      }

      const record = {
        id: isEdit ? accId : makeId('A'),
        type,
        category,
        amount,
        note,
        date: recordDate,
        vehicle: isIncome ? vehicle : '',
        paymentStatus,
        expenseType: isIncome ? '' : expenseType,
        productId: '',
        quantity: 0,
        paidAmount: isEdit ? (state.accounting.find(a => a.id === accId)?.paidAmount || 0) : 0
      };

      if (isIncome && category === '新胎') {
        const productId = String(data.get('productId') || '');
        const qty = Math.max(0, Number(data.get('quantity') || 0));
        if (qty < 1 || !Number.isInteger(qty)) {
          error.hidden = false;
          error.textContent = '请填写大于 0 的整数销售数量。';
          return;
        }
        if (productId === '__OTHER__') {
          const otherSpec = String(data.get('otherSpec') || '').trim();
          const otherBrand = String(data.get('otherBrand') || '').trim();
          if (!otherSpec || !otherBrand) {
            error.hidden = false;
            error.textContent = '选择“其他”时，请填写轮胎型号和品牌。';
            return;
          }
          record.productId = '__OTHER__';
          record.quantity = qty;
          record.otherSpec = otherSpec;
          record.otherBrand = otherBrand;
          record.note = `${record.note ? record.note + ' · ' : ''}${otherSpec} · ${otherBrand} · ${qty}条`;
        } else {
          const product = productById(productId);
          if (!product) {
            error.hidden = false;
            error.textContent = '请选择轮胎。';
            return;
          }
          if (qty > product.stock) {
            error.hidden = false;
            error.textContent = `库存只有 ${product.stock} 条，无法销售 ${qty} 条。`;
            return;
          }
          product.stock -= qty;
          product.updatedAt = nowISO();
          record.productId = product.id;
          record.quantity = qty;
          if (!isEdit) {
            state.transactions.unshift({
              id: makeId('TX'), type: 'out', productId: product.id, quantity: qty, unitPrice: amount / qty,
              note: `新胎销售 · ${category}`, date: recordDate, afterStock: product.stock, payStatus: 'paid'
            });
          }
        }
      }

      if (isEdit) {
        const accIndex = state.accounting.findIndex(a => a.id === accId);
        if (accIndex !== -1) state.accounting[accIndex] = record;
      } else {
        state.accounting.unshift(record);
      }
      persist();
      closeSheet();
      render();
      const hint = isIncome && paymentStatus === 'pending' ? '（已挂账）' : '';
      showToast(`${isIncome ? '收入' : '支出'}${isEdit ? '已修改' : '已记录'}${hint}`);
    }

    // ----- 低库存阈值 -----
    if (form.id === 'lowStockForm') {
      state.settings.lowStockThreshold = Math.max(1, Math.floor(Number(new FormData(form).get('threshold') || 2)));
      persist();
      closeSheet();
      render();
      showToast('低库存提醒已更新');
    }

    // ----- 导入完整备份文件 -----
    if (form.id === 'importSyncFileForm') {
      const data = new FormData(form);
      const file = data.get('syncFile');
      const error = document.getElementById('importSyncFileError');
      try {
        if (!(file instanceof File) || !file.size) throw new Error('请选择备份文件');
        if (file.size > 30 * 1024 * 1024) throw new Error('备份文件不能超过 30MB');
        const imported = hydrateState(JSON.parse(await file.text()));
        state = imported;
        persist();
        closeSheet();
        render();
        showToast('完整库存、图片已导入');
      } catch (importError) {
        error.hidden = false;
        error.textContent = importError.message || '文件无效，请重新选择完整备份文件。';
      }
    }
  });

  // ===== 事件：固定按钮 =====
  syncPill.addEventListener('click', () => switchView('settings'));
  document.getElementById('closeSheet').addEventListener('click', closeSheet);
  document.getElementById('closeImageLightbox').addEventListener('click', closeProductImage);
  document.getElementById('debtDetailBack').addEventListener('click', () => {
    closeDebtDetailFullScreen();
    if (currentDebtListCallback) currentDebtListCallback();
  });
  sheetBackdrop.addEventListener('click', event => { if (event.target === sheetBackdrop) closeSheet(); });
  imageLightbox.addEventListener('click', event => { if (event.target === imageLightbox) closeProductImage(); });
  debtDetailOverlay.addEventListener('click', event => {
    if (event.target === debtDetailOverlay) {
      closeDebtDetailFullScreen();
      if (currentDebtListCallback) currentDebtListCallback();
    }
  });

  // ===== 事件：键盘 ESC 关闭弹层 =====
  document.addEventListener('keydown', event => {
    if (event.key !== 'Escape') return;
    if (!debtDetailOverlay.hidden) { closeDebtDetailFullScreen(); if (currentDebtListCallback) currentDebtListCallback(); }
    else if (!imageLightbox.hidden) closeProductImage();
    else if (!sheetBackdrop.hidden) closeSheet();
  });

  // ===== 事件：跨标签页同步 =====
  window.addEventListener('storage', event => {
    if (event.key === STORAGE_KEY && event.newValue) {
      try { state = hydrateState(JSON.parse(event.newValue)); render(); } catch (error) {}
    }
  });

  if (liveChannel) {
    liveChannel.addEventListener('message', event => {
      if (event.data?.type === 'state-updated' && event.data.state) {
        state = hydrateState(event.data.state);
        writeStateLocally();
        render();
      }
    });
  }

  // ===== Service Worker（生产环境缓存） =====
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js?v=17').catch(() => {}));
  }

  // ===== 启动 =====
  function bootApp() {
    // 移除骨架屏
    const splash = document.getElementById('appBootSplash');
    if (splash) splash.remove();
    // 首屏渲染
    render();
    // 后台异步修复数据，不阻塞首屏
    runBackgroundRepair();
  }

  // 使用 requestAnimationFrame 确保骨架屏先绘制，再执行 JS 渲染
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => requestAnimationFrame(bootApp));
  } else {
    requestAnimationFrame(bootApp);
  }
  </script>
</body>
</html>
